<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<script src="phonepreview.js"></script>
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>The School From Scratch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="page.css">
<link rel="stylesheet" href="phonemenu.css">
</head>
<body>
  <!-- The same menu bar as the home page's; page.js fills it in. -->
  <nav id="quick-nav" aria-label="Menu">
    <div id="quick-list"></div>
  </nav>
  <main>
    <!-- Shown only when the address really is nowhere. Pushing a number
         sends it bouncing around the page (notfound.js). -->
    <p class="digits" id="digits" aria-hidden="true" hidden><span>4</span><span>0</span><span>4</span></p>
    <h1 id="title"></h1>
    <p class="status" id="status">Under Development</p>
    <div class="contact" id="contact" hidden>
      <a class="phone" id="phone" href="#"></a>
      <a id="venmo-link"><img class="venmo" src="assets/venmo_logo.svg" alt="Venmo"></a>
    </div>
  </main>
  <script src="phonemenu.js"></script>
  <script src="editorhook.js"></script>
  <script src="page.js"></script>
  <!-- Physics for the loose characters (MIT licensed, kept in vendor/). -->
  <script src="vendor/matter.min.js"></script>
  <script src="notfound.js"></script>
</body>
</html>
