    panel.id = 'perf';
    perfPanel = panel;
    panel.innerHTML = `
      <div class="perf-head">PERFORMANCE <span class="perf-hint">drag to move · [P] hide</span>
      </div>
      <div class="perf-body">
      <div class="perf-fps"><span data-k="fps">--</span><small>fps</small><span class="perf-rating" data-k="rating"></span></div>
      <canvas class="perf-graph" width="240" height="56"></canvas>
      <div class="perf-legend"><span>frame times · last 4s</span><span>— 60fps  - - 30fps</span></div>
      <div class="perf-section">FRAMES</div>
      <div class="perf-row"><span>frame time avg / worst</span><b data-k="frame"></b></div>
      <div class="perf-row"><span>script time per frame</span><b data-k="script"></b></div>
      <div class="perf-row"><span>slow frames (last 10 s)</span><b data-k="slow"></b></div>
      <div class="perf-row"><span>frames drawn total</span><b data-k="total"></b></div>
      <div class="perf-section">DRAWING</div>
      <div class="perf-row"><span>mode</span><b data-k="mode"></b></div>
      <div class="perf-row"><span>on screen</span><b data-k="drawn"></b></div>
      <div class="perf-row"><span>tiles in memory</span><b data-k="tiles"></b></div>
      <div class="perf-row"><span>tiles built / sec</span><b data-k="built"></b></div>
      <div class="perf-row"><span>areas laid out</span><b data-k="layouts"></b></div>
      <div class="perf-row"><span>canvas size</span><b data-k="canvas"></b></div>
      <div class="perf-section">VIEW</div>
      <div class="perf-row"><span>zoom</span><b data-k="zoom"></b></div>
      <div class="perf-row"><span>position</span><b data-k="pos"></b></div>
      <div class="perf-row"><span>distance from menu</span><b data-k="dist"></b></div>
      <div class="perf-row"><span>state</span><b data-k="state"></b></div>
      <div class="perf-section">SYSTEM</div>
      <div class="perf-row"><span>screen</span><b data-k="screen"></b></div>
      <div class="perf-row"><span>photos loaded</span><b data-k="photos"></b></div>
      <div class="perf-row"><span>JS memory</span><b data-k="heap"></b></div>
      <div class="perf-row"><span>uptime</span><b data-k="uptime"></b></div>
      </div>
      <div class="perf-rs" data-dir="n"></div><div class="perf-rs" data-dir="s"></div>
      <div class="perf-rs" data-dir="e"></div><div class="perf-rs" data-dir="w"></div>
      <div class="perf-rs" data-dir="ne"></div><div class="perf-rs" data-dir="nw"></div>
      <div class="perf-rs" data-dir="se"></div><div class="perf-rs" data-dir="sw"></div>`;
    document.body.appendChild(panel);
    const field = {};
    panel.querySelectorAll('[data-k]').forEach((el) => { field[el.dataset.k] = el; });
    const graph = panel.querySelector('.perf-graph');
    const g = graph.getContext('2d');
    const started = performance.now();

    // A small window: drag the title bar to move it, drag any edge or corner
    // to resize it. Press P to hide it. Its place and size are remembered in
    // this browser (when storage is available).
    const head = panel.querySelector('.perf-head');
    const MIN_W = 200, MIN_H = 120;
    let rect = { left: innerWidth - 256 - 12, top: 12, width: 256, height: Math.min(600, innerHeight - 24) };
    try {
      const saved = JSON.parse(localStorage.getItem('sfs-perf-panel') || 'null');
      if (saved) rect = { ...rect, ...saved };
    } catch {}

    function applyRect() {
      rect.width = clamp(rect.width, MIN_W, innerWidth);
      rect.height = clamp(rect.height, MIN_H, innerHeight);
      rect.left = clamp(rect.left, 0, Math.max(0, innerWidth - rect.width));
      rect.top = clamp(rect.top, 0, Math.max(0, innerHeight - head.offsetHeight));
      Object.assign(panel.style, {
        left: rect.left + 'px', top: rect.top + 'px', right: 'auto',
        width: rect.width + 'px', height: rect.height + 'px', maxHeight: 'none',
      });
    }
    function saveRect() {
      try {
        localStorage.setItem('sfs-perf-panel', JSON.stringify(rect));
      } catch {}
    }
    applyRect();

    // Moving and resizing share one handler: dir says which edges follow the pointer.
    let action = null;
    function startAction(e, dir) {
      if (e.button !== 0) return;
      action = { dir, x: e.clientX, y: e.clientY, start: { ...rect } };
      e.currentTarget.setPointerCapture(e.pointerId);
      e.preventDefault();
      e.stopPropagation();
    }
    function moveAction(e) {
      if (!action) return;
      const dx = e.clientX - action.x, dy = e.clientY - action.y, st = action.start, dir = action.dir;
      if (dir === 'move') {
        rect.left = st.left + dx;
        rect.top = st.top + dy;
      } else {
        if (dir.includes('e')) rect.width = st.width + dx;
        if (dir.includes('s')) rect.height = st.height + dy;
        if (dir.includes('w')) {
          rect.width = Math.max(MIN_W, st.width - dx);
          rect.left = st.left + st.width - rect.width;
        }
        if (dir.includes('n')) {
          rect.height = Math.max(MIN_H, st.height - dy);
          rect.top = st.top + st.height - rect.height;
        }
      }
      applyRect();
    }
    function endAction() {
      if (!action) return;
      action = null;
      saveRect();
    }
    const wire = (el, dir) => {
      el.addEventListener('pointerdown', (e) => startAction(e, dir));
      el.addEventListener('pointermove', moveAction);
      el.addEventListener('pointerup', endAction);
      el.addEventListener('pointercancel', endAction);
    };
    wire(head, 'move');
    panel.querySelectorAll('.perf-rs').forEach((el) => wire(el, el.dataset.dir));

    window.addEventListener('resize', applyRect);

    window.addEventListener('keydown', (e) => {
      if ((e.key === 'p' || e.key === 'P') && !e.ctrlKey && !e.metaKey) panel.hidden = !panel.hidden;
    });

    const fmtNum = (n) => Math.round(n).toLocaleString();
    const fmtBytes = (b) => (b > 1048576 ? (b / 1048576).toFixed(1) + ' MB' : (b / 1024).toFixed(0) + ' KB');
    const fpsColor = (fps) => (fps >= 55 ? '#4ade80' : fps >= 30 ? '#facc15' : '#f87171');

    setInterval(() => {
      if (panel.hidden) return;
      const now = performance.now();
      stats.log = stats.log.filter((f) => now - f.t < 10000);
      const lastSec = stats.log.filter((f) => now - f.t < 1000);
      const gaps = lastSec.map((f) => f.gap).filter((x) => x > 0);
      const fps = lastSec.length;
      const idle = !stats.log.length || now - stats.log[stats.log.length - 1].t > 500;

      field.fps.textContent = idle ? '0' : fps;
      field.fps.style.color = idle ? '#9ca3af' : fpsColor(fps);
      field.rating.textContent = !PERF_RATING ? '' : idle ? 'IDLE' : fps >= 110 ? 'BUTTERY' : fps >= 55 ? 'SMOOTH' : fps >= 30 ? 'OK' : 'CHOPPY';
      field.rating.style.color = field.fps.style.color;

      const avg = (a) => (a.length ? a.reduce((s, v) => s + v, 0) / a.length : 0);
      field.frame.textContent = gaps.length ? `${avg(gaps).toFixed(1)} / ${Math.max(...gaps).toFixed(1)} ms` : '—';
      field.script.textContent = lastSec.length ? `${avg(lastSec.map((f) => f.js)).toFixed(2)} ms` : '—';
      const slow = stats.log.filter((f) => f.gap > 33.4).length;
      field.slow.textContent = slow;
      field.slow.style.color = slow ? '#f87171' : '#4ade80';
      field.total.textContent = fmtNum(stats.totalFrames);

      field.mode.textContent = stats.mode;
      field.drawn.textContent = `${stats.tiles} tiles + ${stats.photos} photos`;
      let tileBytes = 0;
      for (const t of tiles.values()) if (t.canvas) tileBytes += t.canvas.width * t.canvas.height * 4;
      field.tiles.textContent = `${tiles.size} (${fmtBytes(tileBytes)})`;
      field.built.textContent = stats.tilesBuiltLog.filter((t) => now - t < 1000).length;
      stats.tilesBuiltLog = stats.tilesBuiltLog.filter((t) => now - t < 1000);
      field.layouts.textContent = `${fmtNum(layouts.size)} cached · ${fmtNum(stats.layoutsBuilt)} built`;
      field.canvas.textContent = `${photoCanvas.width} × ${photoCanvas.height} px`;

      field.zoom.textContent = cam.s < 1 ? `${(1 / cam.s).toFixed(2)}x out` : `${cam.s.toFixed(2)}x in`;
      field.pos.textContent = `${fmtNum(cam.x)}, ${fmtNum(cam.y)}`;
      const dist = Math.hypot(cam.x, cam.y);
      field.dist.textContent = `${fmtNum(dist)} px (${dist < CROWDED_RADIUS ? 'crowded' : dist < END_DISTANCE ? 'thinning' : 'empty'})`;
      field.state.textContent = moving ? '● moving' : '○ still';
      field.state.style.color = moving ? '#60a5fa' : '#9ca3af';

      field.screen.textContent = `${innerWidth} × ${innerHeight} @ ${devicePixelRatio}x`;
      field.photos.textContent = `${photos.length} of ${IMAGES.length}`;
      field.heap.textContent = performance.memory
        ? `${fmtBytes(performance.memory.usedJSHeapSize)} / ${fmtBytes(performance.memory.jsHeapSizeLimit)}`
        : 'not available in this browser';
      const up = Math.floor((now - started) / 1000);
      field.uptime.textContent = `${Math.floor(up / 60)}m ${String(up % 60).padStart(2, '0')}s`;

      // Frame-time graph: one bar per frame over the last 4 seconds.
      if (graph.width !== graph.clientWidth && graph.clientWidth > 0) graph.width = graph.clientWidth;
      const W = graph.width, H = graph.height, maxMs = 50;
      g.clearRect(0, 0, W, H);
      const recent = stats.log.filter((f) => now - f.t < 4000 && f.gap > 0);
      for (const f of recent) {
        const x = W - ((now - f.t) / 4000) * W;
        const bh = Math.min(H, (f.gap / maxMs) * H);
        g.fillStyle = f.gap > 33.4 ? '#f87171' : f.gap > 16.8 ? '#facc15' : '#4ade80';
        g.fillRect(x, H - bh, 1.5, bh);
      }
      g.strokeStyle = 'rgba(255, 255, 255, 0.35)';
      g.lineWidth = 1;
      g.beginPath();
      const y60 = Math.round(H - (16.7 / maxMs) * H) + 0.5;
      g.moveTo(0, y60); g.lineTo(W, y60);
      g.stroke();
      g.setLineDash([3, 3]);
      g.beginPath();
      const y30 = Math.round(H - (33.3 / maxMs) * H) + 0.5;
      g.moveTo(0, y30); g.lineTo(W, y30);
      g.stroke();
      g.setLineDash([]);
    }, 250);
  }
  if (perfOn) openPerfPanel();

  // Ctrl+P opens the panel even when SHOW_PERFORMANCE_INFO is false (and
  // shows or hides it once open), instead of the browser's print dialog.
  window.addEventListener('keydown', (e) => {
    if (!(e.ctrlKey || e.metaKey) || (e.key !== 'p' && e.key !== 'P')) return;
    e.preventDefault();
    if (!perfPanel) {
      perfOn = true;
      openPerfPanel();
    } else {
      perfPanel.hidden = !perfPanel.hidden;
    }
  });

  function zoomAt(screenX, screenY, newScale) {
    const W = window.innerWidth, H = window.innerHeight;
    newScale = clamp(newScale, MIN_SCALE, MAX_SCALE);
    const wx = cam.x + (screenX - W / 2) / cam.s;
    const wy = cam.y + (screenY - H / 2) / cam.s;
    cam.s = newScale;
    cam.x = wx - (screenX - W / 2) / cam.s;
    cam.y = wy - (screenY - H / 2) / cam.s;
    requestRender();
  }

  // ---- Animation (inertia & return to center) -----------------------------
  let animFrame = 0;
  function stopAnim() {
    cancelAnimationFrame(animFrame);
    animFrame = 0;
  }

  function startInertia(vx, vy) {
    let last = performance.now();
    const step = (now) => {
      const dt = Math.min(now - last, 50);
      last = now;
      cam.x -= (vx * dt) / cam.s;
      cam.y -= (vy * dt) / cam.s;
      const decay = Math.pow(GLIDE, dt / 16.7);
      vx *= decay;
      vy *= decay;
      render();
      animFrame = Math.hypot(vx, vy) > 0.02 ? requestAnimationFrame(step) : 0;
    };
    animFrame = requestAnimationFrame(step);
  }

  function homeScale() {
    const W = window.innerWidth, H = window.innerHeight;
    const fit = Math.min(1, (W - 32) / menu.offsetWidth, (H - 120) / menu.offsetHeight);
    return clamp(fit, MIN_SCALE, 1);
  }

  // Glide back to the main menu at normal zoom.
  function goHome(done) {
    if (READ_MODE) {
      if (location.hash) history.pushState(null, '', location.pathname + location.search);
      glideTo(readHomeTop(), HOME_MS, done);
      return;
    }
    if (done) done();
    stopAnim();
    const from = { ...cam };
    const to = { x: 0, y: 0, s: homeScale() };
    const start = performance.now();
    const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
    const step = (now) => {
      const t = Math.min(1, (now - start) / HOME_MS);
      const e = ease(t);
      cam.x = from.x + (to.x - from.x) * e;
      cam.y = from.y + (to.y - from.y) * e;
      cam.s = from.s + (to.s - from.s) * e;
      render();
      animFrame = t < 1 ? requestAnimationFrame(step) : 0;
    };
    animFrame = requestAnimationFrame(step);
  }

  // ---- Read mode: an ordinary scrolling page -------------------------------
  // The page is as tall as the photo landscape, the menu sits near the top,
  // and every photo in a screen-wide column is a normal image placed down the
  // page. The browser does all the scrolling (wheel, middle-click, scrollbar,
  // keys, touch), so the rest of this file only runs in explore mode.
  const readLayer = document.createElement('div');
  readLayer.id = 'read-photos';
  let readGeo = null; // { W, H, s, top } where top = page position of the menu's centre
  function readGeometry() {
    const W = window.innerWidth, H = window.innerHeight, s = homeScale();
    return { W, H, s, top: H / 2 + Math.min(ABOVE_HOME, END_DISTANCE) * s };
  }
  // Scroll position that puts the main menu in the middle of the screen.
  function readHomeTop() {
    return readGeo ? readGeo.top - readGeo.H / 2 : 0;
  }

  function buildReadPage() {
    const before = readGeo;
    const worldAtTop = before ? (window.scrollY - before.top) / before.s : null;
    // The section at (or next below) the top of the screen, so the same text
    // stays in view when sections change height (window resized, font loaded).
    const anchor = before && sectionEls.find((el) => el.offsetTop + el.offsetHeight > window.scrollY);
    const anchorOffset = anchor ? window.scrollY - anchor.offsetTop : 0;
    const pastHome = before && window.scrollY > readHomeTop() + 1;
    const g = readGeo = readGeometry();
    cam.s = g.s;
    cam.x = 0;
    world.style.transform = `translate(${g.W / 2}px, ${g.top}px) scale(${g.s})`;
    if (!readLayer.parentNode) viewport.insertBefore(readLayer, world);
    layOutSections(g);
    const photosEnd = pageEnd;
    viewport.style.height = Math.ceil(g.top + photosEnd * g.s + g.H / 2) + 'px';

    if (photos.length) {
      // Every photo that falls in the screen-wide column, top to bottom.
      const halfW = g.W / 2 / g.s;
      const worldTop = -g.top / g.s, worldBottom = photosEnd + g.H / 2 / g.s;
      const cx0 = Math.floor((-halfW - PAD) / CHUNK), cx1 = Math.floor((halfW + PAD) / CHUNK);
      const cy0 = Math.floor((worldTop - PAD) / CHUNK), cy1 = Math.floor((worldBottom + PAD) / CHUNK);
      const els = [];
      for (let cy = cy0; cy <= cy1; cy++) {
        for (let cx = cx0; cx <= cx1; cx++) {
          for (const it of chunkLayout(cx, cy)) {
            if (!it.kept || Math.abs(it.x) - it.hw > halfW || it.y + it.hh < worldTop) continue;
            els.push(readPhoto(it, g));
          }
        }
      }
      readLayer.replaceChildren(...els);
      stats.photos = els.length;
    }
    stats.mode = 'read mode: normal page scrolling';
    // Keep the same part of the page on screen when the window is resized.
    if (anchor && pastHome) {
      window.scrollTo({ top: anchor.offsetTop + anchorOffset, behavior: 'instant' });
    } else if (worldAtTop !== null) {
      window.scrollTo({ top: g.top + worldAtTop * g.s, behavior: 'instant' });
    }
    readFrame();
  }

  // One section per menu option, in menu order. Each one's text is the file
  // sections/<option name>.md (People -> sections/people.md), written in
  // Markdown. A missing or empty file shows "Under Development".
  const SECTION_DIR = 'sections/';
  // Things built separately that a section can drop in by name (!wheel!).
  const EMBEDS = setting('EMBEDS', {});
  const EMBED_HEIGHT = Math.max(40, setting('EMBED_HEIGHT', 420));
  const EMBEDS_TOUCHABLE = setting('EMBEDS_YOU_CAN_TOUCH', []);
  const EMBED_WAKE = setting('EMBED_WAKE_LABEL', 'Click to use');
  const sectionsLayer = document.createElement('div');
  sectionsLayer.id = 'sections';
  let sectionEls = [];
  const sectionSlugs = () => menuLinks.map((link) => pageSlug(link.dataset.label || link.textContent));
  function loadSectionTexts() {
    return Promise.all(sectionSlugs().map((slug) =>
      fetch(SECTION_DIR + slug + '.md', { cache: 'no-cache' })
        .then((r) => (r.ok ? r.text() : ''))
        .catch(() => '')
        .then((text) => [slug, text.trim() ? withEmbeds(markdownToHtml(text), EMBEDS, EMBED_HEIGHT, EMBEDS_TOUCHABLE, EMBED_WAKE) : ''])))
      .then((pairs) => new Map(pairs));
  }

  function buildSections(texts) {
    const contactSlugs = setting('CONTACT_PAGES', ['Cost']).map(pageSlug);
    sectionEls = menuLinks.filter((link) => !optionLink(link.dataset.label || link.textContent)).map((link) => {
      const label = link.dataset.label || link.textContent;
      const slug = pageSlug(label);
      const section = document.createElement('section');
      section.className = 'section' + (PICTURE_HEIGHT ? ' set-picture-height' : '');
      section.id = slug;
      const heading = document.createElement('h2');
      heading.textContent = label;
      const body = document.createElement('div');
      const html = texts.get(slug);
      if (html) {
        body.innerHTML = html;
      } else {
        const status = document.createElement('p');
        status.className = 'status';
        status.textContent = 'Under Development';
        body.appendChild(status);
      }
      if (contactSlugs.includes(slug)) body.appendChild(contactDetails());
      section.append(heading, body);
      return section;
    });
    sectionsLayer.replaceChildren(...sectionEls);
    viewport.appendChild(sectionsLayer);
    // A section changes height when a font or the Venmo logo finishes
    // loading; the photos are then laid out again around the new size.
    if ('ResizeObserver' in window) {
      let queued = false;
      const observer = new ResizeObserver(() => {
        if (queued || !readGeo) return;
        queued = true;
        requestAnimationFrame(() => { queued = false; buildReadPage(); });
      });
      sectionEls.forEach((el) => observer.observe(el));
    }
  }

  // Phone number and Venmo logo (same settings as the Cost page).
  function contactDetails() {
    const box = document.createElement('div');
    box.className = 'contact';
    const phone = setting('PHONE_NUMBER', '+1 (805) 798-5098').trim();
    if (phone) {
      const a = document.createElement('a');
      a.className = 'phone';
      a.textContent = phone;
      a.href = 'tel:' + phone.replace(/[^\d+]/g, '');
      box.appendChild(a);
    }
    if (setting('SHOW_VENMO_LOGO', true)) {
      const venmoLink = setting('VENMO_LINK', '').trim();
      const a = document.createElement('a');
      if (/^https:\/\//i.test(venmoLink)) {
        a.href = venmoLink;
        a.target = '_blank';
        a.rel = 'noopener';
      }
      const img = new Image();
      img.className = 'venmo';
      img.alt = 'Venmo';
      img.src = 'assets/venmo_logo.svg';
      a.appendChild(img);
      box.appendChild(a);
    }
    return box;
  }

  // Stack the sections down the page below the menu, SECTION_SPACE apart,
  // and record where photos must stay clear of them. The photo layout is
  // rebuilt whenever that changes.
  // The quote at the end of the page (END_QUOTE), sitting a little above
  // the bottom of the scroll.
  const quoteEl = document.createElement('div');
  quoteEl.className = 'end-quote';
  // Written the same way as the section files, so *italic*, **bold** and
  // ***both*** are up to whoever writes the quote.
  quoteEl.innerHTML = END_QUOTE ? markdownToHtml(END_QUOTE) : '';
  let pageEnd = 0; // how far down the page goes, in landscape units

  function layOutSections(g) {
    // The empty space the lift adds under the options belongs to the menu's
    // box, so it is taken off again here: the gap before the first section
    // is measured from the options, not from the bottom of that space.
    let y = menuHalfH - menuLift + SECTION_SPACE;
    const bands = [];
    contentBottom = 0;
    for (const el of sectionEls) {
      el.style.top = (g.top + y * g.s).toFixed(1) + 'px';
      const h = el.offsetHeight / g.s;
      const hx = el.offsetWidth / 2 / g.s + SECTION_CLEARANCE;
      bands.push({ hx, y0: y - SECTION_CLEARANCE, y1: y + h + SECTION_CLEARANCE });
      contentBottom = y + h;
      y += h + SECTION_SPACE;
    }
    if (bands.length) {
      fadeStart = bands[0].y0;
      fadeLength = Math.max(SECTION_THIN, (contentBottom - fadeStart) / 0.7);
    }
    // Where the page stops: after the last section plus the run-on set in
    // settings, or where the photos run out, whichever comes first.
    // (Without sections: END_DISTANCE from the menu.)
    pageEnd = bands.length
      ? Math.min(fadeStart + fadeLength, contentBottom + BELOW_END)
      : END_DISTANCE;

    // The quote sits just above the bottom of the page, and photos keep
    // clear of it as they do of the sections.
    if (END_QUOTE) {
      if (!quoteEl.parentNode) sectionsLayer.appendChild(quoteEl);
      // Where the page itself ends, in screen pixels (the scroll runs half a
      // screen past the last photos).
      const bottomOfPage = g.top + pageEnd * g.s + g.H / 2;
      quoteEl.style.top = '0px'; // measured unrotated, before it's placed
      const highEnough = g.top + (contentBottom + SECTION_CLEARANCE) * g.s;
      const top = Math.max(highEnough, bottomOfPage - END_QUOTE_ABOVE * g.s - quoteEl.offsetHeight);
      quoteEl.style.top = top.toFixed(1) + 'px';
      const at = (top - g.top) / g.s;
      const h = quoteEl.offsetHeight / g.s;
      bands.push({
        hx: quoteEl.offsetWidth / 2 / g.s + SECTION_CLEARANCE,
        y0: at - SECTION_CLEARANCE,
        y1: at + h + SECTION_CLEARANCE,
      });
    }
    if (JSON.stringify(bands) !== JSON.stringify(textBands)) {
      textBands = bands;
      layouts.clear();
    }
  }

  // Scroll to the section named in the address (#cost), or to Home.
  // (glide = true: move there smoothly, as when a menu option is chosen.)
  // (done: called once it's there, or when the glide is interrupted.)
  function scrollToHash(glide, done) {
    const id = decodeURIComponent(location.hash.slice(1));
    const target = id && sectionEls.find((el) => el.id === id);
    const top = target ? sectionTop(target) : readHomeTop();
    if (glide) glideTo(top, target ? SECTION_SCROLL_MS : HOME_MS, done);
    else window.scrollTo({ top, behavior: 'instant' });
  }
  const sectionTop = (el) => Math.max(0, el.offsetTop - SECTION_MARGIN);

  // Smooth scrolling to a spot on the page: starts gently, speeds up, and
  // settles in, taking the same time however far it goes. The browser's own
  // smooth scrolling jumps across long distances, so the page is moved here
  // frame by frame instead. Scrolling by hand stops it.
  let glideFrame = 0, glideDone = null;
  function endGlide() {
    cancelAnimationFrame(glideFrame);
    glideFrame = 0;
    const done = glideDone;
    glideDone = null;
    if (done) done();
  }
  function glideTo(top, ms, done) {
    endGlide();
    const from = window.scrollY, distance = top - from;
    if (!SMOOTH_LINKS || ms <= 0 || Math.abs(distance) < 2) {
      window.scrollTo({ top, behavior: 'instant' });
      // No glide to wait for: let the nudge show for a moment anyway.
      if (done) setTimeout(done, NUDGE_MS * 2);
      return;
    }
    glideDone = done || null;
    const start = performance.now();
    const ease = (t) => (t < 0.5 ? 4 * t * t * t : 1 - Math.pow(-2 * t + 2, 3) / 2);
    const step = (now) => {
      const t = Math.min(1, (now - start) / ms);
      window.scrollTo({ top: from + distance * ease(t), behavior: 'instant' });
      if (t < 1) glideFrame = requestAnimationFrame(step);
      else { glideFrame = 0; endGlide(); }
    };
    glideFrame = requestAnimationFrame(step);
  }
  for (const type of ['wheel', 'touchstart', 'keydown']) {
    window.addEventListener(type, () => { if (glideFrame) endGlide(); }, { passive: true });
  }

  function readPhoto(it, g) {
    const photo = photos[it.index];
    const el = document.createElement('div');
    el.className = 'read-photo';
    const r = cornerRadius(it) * g.s;
    Object.assign(el.style, {
      left: (g.W / 2 + (it.x - it.hw) * g.s).toFixed(1) + 'px',
      top: (g.top + (it.y - it.hh) * g.s).toFixed(1) + 'px',
      padding: FRAME_PADDING * g.s + 'px',
      border: FRAME_BORDER > 0 ? `${FRAME_BORDER * g.s}px solid ${FRAME_COLOR}` : 'none',
      background: FRAME_FILL,
      borderRadius: r + 'px',
    });
    const img = new Image();
    img.alt = '';
    img.decoding = 'async';
    img.loading = 'lazy';
    img.draggable = false;
    img.width = Math.round(it.w * g.s);
    img.height = Math.round(it.h * g.s);
    img.style.borderRadius = Math.max(0, r - FRAME * g.s) + 'px';
    img.onload = () => el.classList.add('loaded');
    img.onerror = () => { if (!img.src.endsWith(photo.file)) img.src = IMAGE_DIR + photo.file; };
    img.src = photoSrc(photo.file);
    el.appendChild(img);
    return el;
  }

  // Runs on scroll: shows the menu button once the main menu is off screen,
  // keeps the (optional) grid lined up, and feeds the performance panel.
  function readFrame() {
    if (!readGeo) return;
    const g = readGeo;
    const originY = g.top - window.scrollY;
    cam.y = (window.scrollY + g.H / 2 - g.top) / g.s;
    updateQuickNav(g.W / 2, originY, g.s, g.W, g.H);
    if (GRID_ON) {
      const c = prepareCanvas(gridCanvas, gridCtx, window.devicePixelRatio || 1);
      paintGrid(gridCtx, c.w, c.h, g.W / 2, originY, g.s);
    }
    if (perfOn) {
      const t = performance.now();
      stats.log.push({ t, js: 0, gap: stats.lastFrameAt && t - stats.lastFrameAt < 250 ? t - stats.lastFrameAt : 0 });
      stats.lastFrameAt = t;
      stats.totalFrames++;
    }
  }

  // ---- Input: drag, pinch, wheel, keys ------------------------------------
  const pointers = new Map();
  let samples = [];
  let dragDistance = 0;

  viewport.addEventListener('pointerdown', (e) => {
    if (e.pointerType === 'mouse' && e.button !== 0) return;
    // Read mode: no dragging with a mouse or pen; a finger can still swipe
    // the page up and down, like scrolling on a phone.
    if (READ_MODE) return;
    stopAnim();
    pointers.set(e.pointerId, { x: e.clientX, y: e.clientY });
    samples = [];
    if (pointers.size === 1) dragDistance = 0;
  });

  viewport.addEventListener('pointermove', (e) => {
    const p = pointers.get(e.pointerId);
    if (!p) return;
    const dx = e.clientX - p.x, dy = e.clientY - p.y;

    if (pointers.size === 1) {
      dragDistance += Math.hypot(dx, dy);
      if (dragDistance > 4 && !viewport.hasPointerCapture(e.pointerId)) {
        viewport.setPointerCapture(e.pointerId);
        viewport.classList.add('dragging');
      }
      if (!READ_MODE) cam.x -= dx / cam.s;
      cam.y -= dy / cam.s;
      samples.push({ t: e.timeStamp, dx: READ_MODE ? 0 : dx, dy });
      if (samples.length > 8) samples.shift();
      requestRender();
    } else if (pointers.size === 2 && !READ_MODE) {
      dragDistance = Infinity;
      const other = [...pointers.entries()].find(([id]) => id !== e.pointerId)[1];
      const oldMidX = (p.x + other.x) / 2, oldMidY = (p.y + other.y) / 2;
      const oldDist = Math.hypot(p.x - other.x, p.y - other.y);
      const newMidX = (e.clientX + other.x) / 2, newMidY = (e.clientY + other.y) / 2;
      const newDist = Math.hypot(e.clientX - other.x, e.clientY - other.y);
      if (oldDist > 0) zoomAt(oldMidX, oldMidY, cam.s * (newDist / oldDist));
      cam.x -= (newMidX - oldMidX) / cam.s;
      cam.y -= (newMidY - oldMidY) / cam.s;
      requestRender();
    }
    p.x = e.clientX;
    p.y = e.clientY;
  });

  function endPointer(e) {
    if (!pointers.delete(e.pointerId)) return;
    if (pointers.size > 0) { samples = []; return; }
    viewport.classList.remove('dragging');
    const recent = samples.filter((s) => e.timeStamp - s.t < 80);
    if (recent.length >= 2) {
      const span = Math.max(16, e.timeStamp - recent[0].t);
      const vx = recent.reduce((a, s) => a + s.dx, 0) / span;
      const vy = recent.reduce((a, s) => a + s.dy, 0) / span;
      if (Math.hypot(vx, vy) > 0.1) startInertia(vx, vy);
    }
    samples = [];
  }
  viewport.addEventListener('pointerup', endPointer);
  viewport.addEventListener('pointercancel', endPointer);

  viewport.addEventListener('wheel', (e) => {
    if (READ_MODE) return; // the browser scrolls the page itself
    // Explore mode: scrolling zooms in and out around the pointer.
    e.preventDefault();
    stopAnim();
    let dy = e.deltaY;
    if (e.deltaMode === 1) dy *= 16;
    // A trackpad pinch arrives as Ctrl + small steps; Ctrl + a mouse wheel
    // arrives as Ctrl + big steps and should zoom at the normal wheel speed.
    const sensitivity = e.ctrlKey && Math.abs(dy) < 50 ? PINCH_SPEED : WHEEL_SPEED;
    zoomAt(e.clientX, e.clientY, cam.s * Math.exp(-dy * sensitivity));
  }, { passive: false });

  // Safari trackpad gestures would otherwise zoom the whole page.
  document.addEventListener('gesturestart', (e) => { if (!READ_MODE) e.preventDefault(); });

  window.addEventListener('keydown', (e) => {
    if (READ_MODE) return; // the browser handles the keys
    const step = KEY_STEP / cam.s;
    const moves = { ArrowLeft: [-step, 0], ArrowRight: [step, 0], ArrowUp: [0, -step], ArrowDown: [0, step] };
    if (moves[e.key]) {
      e.preventDefault();
      stopAnim();
      cam.x += moves[e.key][0];
      cam.y += moves[e.key][1];
      requestRender();
    } else if (e.key === '+' || e.key === '=') {
      zoomAt(window.innerWidth / 2, window.innerHeight / 2, cam.s * 1.2);
    } else if (e.key === '-' || e.key === '_') {
      zoomAt(window.innerWidth / 2, window.innerHeight / 2, cam.s / 1.2);
    }
  });

  // Menu links open their page, except when the click was really the end of
  // a drag that happened to start on a link.
  menu.querySelectorAll('a').forEach((a) => a.addEventListener('click', (e) => {
    if (dragDistance > 4) e.preventDefault();
  }));

  // ---- Nudge on click --------------------------------------------------------
  // The chosen option (only the one clicked, not its twin in the other menu) changes until
  // the page arrives at its section: its letters jump to scattered heights
  // (NUDGE), spread apart (EXPAND), and the whole word leans the way the page
  // is heading (MOVE). Each can be switched on or off.
  const NUDGE_ON = setting('MENU_CLICK_NUDGE', true);
  const NUDGE_EM = Math.max(0, setting('MENU_CLICK_NUDGE_AMOUNT', 0.2));
  const NUDGE_MS = Math.max(0, setting('MENU_CLICK_NUDGE_SPEED_MS', 300));
  const EXPAND_ON = setting('MENU_CLICK_EXPAND', true);
  const EXPAND_EM = Math.max(0, setting('MENU_CLICK_EXPAND_AMOUNT', 0.12));
  const MOVE_ON = setting('MENU_CLICK_MOVE_TOWARD_SECTION', true);
  rootStyle.setProperty('--nudge-ms', NUDGE_MS + 'ms');
  rootStyle.setProperty('--word-shift', Math.max(0, setting('MENU_CLICK_MOVE_AMOUNT', 0.4)) + 'em');
  let nudgedLinks = [], nudgeId = 0;
  function settleNudge() {
    nudgedLinks.forEach((link) => link.classList.remove('nudged', 'heading-down', 'heading-up'));
    nudgedLinks = [];
  }
  // direction: 1 = the page is heading down, -1 = up, 0 = not moving.
  // Returns this click's own "arrived" function: it settles the letters only
  // if no other option has been clicked since (a quick second click ends the
  // first glide, and must not settle its own letters).
  function nudge(links, direction) {
    settleNudge();
    const id = ++nudgeId;
    const settle = () => { if (id === nudgeId) settleNudge(); };
    if (!NUDGE_ON && !EXPAND_ON && !MOVE_ON) return settle;
    for (const link of links) {
      const letters = [...link.querySelectorAll('.menu-letter, .bar-letter')];
      const middle = (letters.length - 1) / 2;
      letters.forEach((letter, i) => {
        // Up and down: alternate, each by a random share of the amount.
        const y = NUDGE_ON ? (0.4 + 0.6 * Math.random()) * NUDGE_EM * (i % 2 ? 1 : -1) : 0;
        // Sideways: each letter moves out from the middle of the word.
        const x = EXPAND_ON ? (i - middle) * EXPAND_EM : 0;
        letter.style.setProperty('--ny', y.toFixed(3) + 'em');
        letter.style.setProperty('--nx', x.toFixed(3) + 'em');
      });
      link.classList.add('nudged');
      if (MOVE_ON && direction) link.classList.add(direction > 0 ? 'heading-down' : 'heading-up');
    }
    nudgedLinks = links;
    return settle;
  }

  // ---- Glow on click ---------------------------------------------------------
  // A clicked menu option (home screen or menu bar) glows for a moment.
  if (setting('MENU_CLICK_GLOW', true)) {
    rootStyle.setProperty('--glow-color', setting('MENU_CLICK_GLOW_COLOR', '#9fc25a'));
    rootStyle.setProperty('--glow-ms', Math.max(0, setting('MENU_CLICK_GLOW_MS', 1200)) + 'ms');
    document.addEventListener('click', (e) => {
      const link = e.target.closest('#menu a, #quick-list a');
      if (!link) return;
      link.classList.remove('glow');
      void link.offsetWidth; // restart the glow if it's clicked again mid-glow
      link.classList.add('glow');
    });
    document.addEventListener('animationend', (e) => {
      if (e.animationName === 'menu-glow') e.target.classList.remove('glow');
    });
  }

  // ---- Menu bar across the top ----------------------------------------------
  // The bar lists the same options as the main menu (built from MENU_ITEMS)
  // and only appears once the main menu is off screen. First option: Home,
  // which glides back to the main menu.
  // Each option's letters are separate pieces, so they can be nudged.
  const barLetters = (text) => [...text].map((ch) => {
    const span = document.createElement('span');
    span.className = 'bar-letter';
    span.textContent = ch === ' ' ? '\u00a0' : ch;
    return span;
  });
  const homeLink = document.createElement('a');
  homeLink.href = '#';
  const homeLabel = String(setting('TOP_MENU_HOME_LABEL', 'Home')).trim() || 'Home';
  homeLink.setAttribute('aria-label', homeLabel);
  homeLink.append(...barLetters(homeLabel));
  homeLink.addEventListener('click', (e) => {
    e.preventDefault();
    goHome(nudge([homeLink], Math.sign(readHomeTop() - window.scrollY)));
  });
  // Options shown only in the bar (TOP_MENU_EXTRA_ITEMS), after the ones
  // from the main menu. Their addresses come from MENU_LINKS, the same as
  // any other option's.
  const extras = setting('TOP_MENU_EXTRA_ITEMS', []).map((item) => String(item).trim()).filter(Boolean)
    .filter(shown).map((label) => {
      const link = document.createElement('a');
      link.href = optionLink(label) || pageSlug(label) + '.html';
      link.dataset.label = label;
      return link;
    });
  quickList.replaceChildren(homeLink, ...[...menu.querySelectorAll('nav a'), ...extras].map((link) => {
    const copy = document.createElement('a');
    copy.href = link.getAttribute('href');
    const label = link.dataset.label || link.textContent;
    copy.setAttribute('aria-label', label);
    copy.append(...barLetters(label));
    return copy;
  }));
  let quickShown = false;
  // originX/originY: where the menu's centre is on screen; scale: the zoom.
  function updateQuickNav(originX, originY, scale, W, H) {
    const hw = menuHalfW * scale, hh = menuHalfH * scale;
    const menuOnScreen = originX + hw > 0 && originX - hw < W && originY + hh > 0 && originY - hh < H;
    if (menuOnScreen === !quickShown) return;
    quickShown = !menuOnScreen;
    quickNav.classList.toggle('show', quickShown);
  }

  // The menu's size decides where photos can't go; rebuild if it changes.
  function measureMenu() {
    const w = menu.offsetWidth / 2, h = menu.offsetHeight / 2;
    if (w === menuHalfW && h === menuHalfH) return;
    menuHalfW = w;
    menuHalfH = h;
    layouts.clear();
    tiles.clear();
    revealed.clear();
  }

  // ---- Start --------------------------------------------------------------
  measureMenu();
  if (READ_MODE) {
    if ('scrollRestoration' in history) history.scrollRestoration = 'manual';
    document.documentElement.classList.remove('grid-merged'); // grid gets its own layer here
    rootStyle.setProperty('--photo-fade-in', FADE_IN_MS + 'ms');
    let scrollQueued = false;
    window.addEventListener('scroll', () => {
      if (scrollQueued) return;
      scrollQueued = true;
      requestAnimationFrame(() => { scrollQueued = false; readFrame(); });
    }, { passive: true });
    let resizeTimer = 0;
    window.addEventListener('resize', () => {
      clearTimeout(resizeTimer);
      resizeTimer = setTimeout(() => { liftMenu(); measureMenu(); buildReadPage(); }, 150);
    });
    buildReadPage();
    scrollToHash();
    loadSectionTexts().then((texts) => {
      buildSections(texts);
      buildReadPage();
      if (location.hash) scrollToHash();
    });
    // Once the fonts arrive the text changes height; a visitor who arrived
    // at a section (#cost) is put back at its start.
    if (document.fonts) document.fonts.ready.then(() => {
      measureMenu();
      buildReadPage();
      if (location.hash && window.scrollY > readHomeTop() + 1) scrollToHash();
    });
    // Menu options (home screen and top bar) glide to their section, their
    // letters nudged until they arrive. Ctrl-, Shift- or middle-clicks are
    // left alone so "open in new tab" still works.
    document.addEventListener('click', (e) => {
      const link = e.target.closest('#menu a, #quick-list a');
      if (!link || e.defaultPrevented || e.button || e.ctrlKey || e.metaKey || e.shiftKey || e.altKey) return;
      const hash = link.getAttribute('href');
      if (!hash || hash.length < 2 || hash[0] !== '#') return;
      e.preventDefault();
      if (location.hash !== hash) history.pushState(null, '', hash);
      const target = sectionEls.find((el) => '#' + el.id === hash);
      scrollToHash(true, nudge([link], target ? Math.sign(sectionTop(target) - window.scrollY) : 0));
    });
    // Back and Forward move between the sections visited from the menu.
    window.addEventListener('popstate', () => {
      scrollToHash(true);
    });
    loadPhotos().then((list) => { photos = list; buildReadPage(); });
  } else {
    window.addEventListener('resize', () => { liftMenu(); measureMenu(); requestRender(); });
    if (document.fonts) document.fonts.ready.then(() => { measureMenu(); requestRender(); });
    cam.s = homeScale();
    render();
    loadPhotos().then((list) => {
      photos = list;
      render();
    });
  }
}

loadSettings().then(startGallery);
</script>
</body>
</html>
