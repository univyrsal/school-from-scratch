<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no">
<title>The School From Scratch</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<style>
  :root {
    --bg: #000;
    --fg: #fff;
    --muted: #aaa;
    --frame: rgba(255, 255, 255, 0.35);
    --heading-size: 64px;
    --body-size: 24px;
    --title-gap: 72px;
    --heading-font: 'Lora', Georgia, serif;
    --heading-weight: 600;
    --body-font: 'Quicksand', 'Segoe UI', sans-serif;
    --body-weight: 500;
    --menu-spacing-start: 0.3em;
    --menu-spacing-hover: 0.06em;
    --menu-spacing-ms: 450ms;
  }
  html, body {
    height: 100%;
    margin: 0;
    background: var(--bg);
    color: var(--fg);
    overflow: hidden;
    font-family: var(--body-font);
    font-weight: var(--body-weight);
  }
  /* The scrollbar down the side is hidden unless SHOW_SCROLLBAR turns it on.
     Hidden is the way round that needs no waiting: the page starts this way
     and the class is added only if the setting asks for it, so the bar never
     shows for a moment and disappears. Scrolling itself is untouched. */
  html { scrollbar-width: none; -ms-overflow-style: none; }
  html::-webkit-scrollbar,
  body::-webkit-scrollbar { width: 0; height: 0; display: none; }
  html.show-scrollbar { scrollbar-width: auto; -ms-overflow-style: auto; }
  html.show-scrollbar::-webkit-scrollbar,
  html.show-scrollbar body::-webkit-scrollbar { width: auto; height: auto; display: block; }

  /* The pannable / zoomable landscape */
  #viewport {
    position: fixed;
    inset: 0;
    overflow: hidden;
    cursor: grab;
    touch-action: none;
    user-select: none;
    -webkit-user-select: none;
  }
  #viewport.dragging { cursor: grabbing; }
  /* Read mode is an ordinary scrolling page: the browser scrolls it, and the
     photos are normal images laid out down the page. */
  html.read-mode,
  html.read-mode body {
    height: auto;
    overflow-x: hidden;
  }
  html.read-mode { overflow-y: auto; }
  html.read-mode body { overflow: visible; }
  .read-mode #viewport {
    position: relative;
    inset: auto;
    width: 100%;
    cursor: default;
    touch-action: auto;
  }
  .read-mode #photos { display: none; }
  .read-mode #grid { position: fixed; width: 100vw; height: 100vh; }
  #read-photos {
    position: absolute;
    inset: 0;
    pointer-events: none;
  }
  .read-photo {
    position: absolute;
    line-height: 0;
    opacity: 0;
    transition: opacity var(--photo-fade-in, 500ms) ease;
  }
  .read-photo.loaded { opacity: 1; }
  .read-photo img { display: block; }

  /* Read mode: a section of text for each menu option, down the page below
     the menu, with room for photos in between. The script places them. */
  #sections {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    pointer-events: none;
  }
  .section {
    position: absolute;
    left: 50%;
    width: min(var(--section-width, 720px), 100% - 32px);
    transform: translateX(-50%);
    box-sizing: border-box;
    scroll-margin-top: var(--section-scroll-margin, 96px);
    pointer-events: auto;
    cursor: auto;
    user-select: text;
    -webkit-user-select: text;
    font-size: var(--section-text-size, 19px);
    line-height: 1.6;
    overflow-wrap: break-word;
  }
  .section h2 {
    margin: 0 0 0.6em;
    font-family: var(--heading-font);
    font-weight: var(--heading-weight);
    font-size: min(var(--section-heading-size, 44px), 10vw);
    line-height: 1.15;
    letter-spacing: 0.02em;
    text-align: center;
  }
  .section h3 {
    margin: 1.6em 0 0.5em;
    font-size: 1em;
    font-weight: 700;
    line-height: 1.4;
  }
  .section h2 + div > h3:first-child { margin-top: 0; }
  /* A person's name (## in a section file), and the lines right under it. */
  .section h3.name {
    margin-top: 2.2em;
    font-size: 1.15em;
    text-align: center;
  }
  /* Words pushed into the middle of the page, between -> and <- in the file. */
  .section .centered { text-align: center; }
  /* A centered list has no room down the left for its bullets, so they go in
     front of the words instead. */
  .section ul.centered,
  .section ol.centered { list-style-position: inside; padding-left: 0; }
  /* Two columns either side of a gutter down the middle, for a cast list:
     Role — Name in the file. Each side is set against the gutter, so the two
     read as one list however long the words on either side are. */
  .section .pairs {
    display: grid;
    grid-template-columns: 1fr 1fr;
    column-gap: var(--pair-gap, 64px);
    margin: 0 auto 1em;
    max-width: var(--paragraph-width, none);
  }
  .section .pairs p { margin: 0; }
  .section .pairs .pair-left { text-align: right; }
  .section .pairs .pair-right { text-align: left; }
  .section .pairs .pair-dash { display: none; }
  /* With TWO_COLUMN_DASH on, the dash stands in the gutter with half the
     space either side, so the two sides stay as far apart as they were. */
  .two-column-dash .section .pairs {
    grid-template-columns: 1fr minmax(var(--pair-gap, 64px), auto) 1fr;
    column-gap: 0;
  }
  .two-column-dash .section .pairs .pair-dash { display: block; text-align: center; }
  .section .pairs .pair-dash::before { content: var(--pair-dash-char, "\2014"); }
  /* Side by side there is no room on a narrow screen, so they stack instead,
     each pair kept together and set in the middle. */
  @media (max-width: 480px) {
    .section .pairs,
    .two-column-dash .section .pairs { grid-template-columns: 1fr; column-gap: 0; }
    .section .pairs .pair-left { text-align: center; margin-top: 0.5em; }
    .section .pairs .pair-right { text-align: center; }
    .two-column-dash .section .pairs .pair-dash { display: none; }
  }
  /* Pictures in a section (a headshot, for example). */
  .section p.picture { margin: 0.8em 0 0.9em; text-align: center; line-height: 0; }
  .section .md-image {
    max-width: min(var(--section-image-width, 200px), 100%);
    height: auto;
    border-radius: var(--section-image-radius, 15px);
  }
  /* SECTION_PICTURE_HEIGHT: every picture the same height. It fills that
     height and its width, taking the middle of the picture if the two
     don't match, so a row of headshots lines up. */
  .section.set-picture-height .md-image {
    width: min(var(--section-image-width, 200px), 100%);
    height: var(--section-image-height);
    object-fit: cover;
    object-position: center;
  }
  /* Paragraphs and lists can be kept narrower than the section itself
     (SECTION_PARAGRAPH_WIDTH), which makes them easier to read; headings,
     names and pictures still use the section's full width. */
  .section p { margin: 0 auto 1em; max-width: var(--paragraph-width, none); }
  /* An extra empty line in a section file. */
  .section .md-space { height: 1em; margin: 0; }
  /* Something built separately, dropped into a section by name (!wheel!).
     It sits in a frame of its own, so its own styling stays inside it. */
  .section .embed,
  .pay-content .embed {
    display: block;
    width: 100%;
    margin: 1.2em 0;
    border: none;
    background: transparent;
    color-scheme: normal;
    /* Something shown this way is to look at, not to touch: the pointer and
       a finger go straight through to the page, so scrolling over it
       scrolls the page as anywhere else. */
    pointer-events: none;
  }
  /* An embed set to touch: "always" is one you fill in — a box for an
     address, say. It has nothing to take a roll of the wheel with, so it
     needs no gate in front of it. */
  .section .embed.always-on,
  .pay-content .embed.always-on { pointer-events: auto; }
  /* An embed named in EMBEDS_YOU_CAN_TOUCH is different: it waits under a
     word, and once that word is clicked it can be used like anything else
     until the pointer leaves it again. Scrolling past it is never caught. */
  .embed-holder {
    display: block;
    position: relative;
  }
  .embed-holder.awake > .embed { pointer-events: auto; }
  .embed-holder.awake > .embed-wake { display: none; }
  .embed-wake {
    position: absolute;
    top: 1.2em;
    right: 0;
    bottom: 1.2em;
    left: 0;
    display: flex;
    align-items: center;
    justify-content: center;
    border: 0;
    background: transparent;
    font: inherit;
    cursor: pointer;
  }
  .embed-wake span {
    padding: 7px 16px;
    border-radius: 999px;
    background: var(--accent, #e8f0d4);
    color: var(--text, #2f3a22);
    font-size: 15px;
    line-height: 1;
    box-shadow: 0 1px 6px rgba(0, 0, 0, 0.18);
  }
  .embed-wake:hover span { filter: brightness(0.96); }
  .end-quote p { margin: 0; }
  .end-quote p + p { margin-top: 0.8em; }
  /* The quote at the end of the page (END_QUOTE). */
  .end-quote {
    position: absolute;
    left: 50%;
    width: min(var(--section-width, 720px), 100% - 32px);
    margin: 0;
    transform: translateX(-50%);
    font-size: min(var(--end-quote-size, 24px), 6vw);
    line-height: 1.5;
    text-align: center;
    pointer-events: auto;
    user-select: text;
    -webkit-user-select: text;
  }
  /* A list with empty lines between its items sits a little further apart. */
  .section ul.spaced li,
  .section ol.spaced li { margin-bottom: 1em; }
  .section ul,
  .section ol { margin: 0 auto 1em; padding-left: 1.3em; max-width: var(--paragraph-width, none); }
  /* Written 1) 2) 3) rather than 1. 2. 3., a numbered list becomes the
     steps: each number in a filled accent circle, with room between them.
     (The payments page keeps its own copy of these, in page.css.) */
  .section ol.steps {
    counter-reset: step;
    padding-left: 0;
    list-style: none;
  }
  .section ol.steps li {
    position: relative;
    min-height: var(--step-circle, 36px);
    padding-left: calc(var(--step-circle, 36px) + 18px);
    margin-bottom: var(--step-gap, 28px);
  }
  .section ol.steps li:last-child { margin-bottom: 0; }
  .section ol.steps li::before {
    counter-increment: step;
    content: counter(step);
    position: absolute;
    left: 0;
    top: calc((1.6em - var(--step-circle, 36px)) / 2);
    display: flex;
    align-items: center;
    justify-content: center;
    width: var(--step-circle, 36px);
    height: var(--step-circle, 36px);
    border-radius: 50%;
    background: var(--accent, #e8f0d4);
    color: var(--fg);
    font-weight: 700;
    font-size: 0.95em;
  }
  .section li { margin-bottom: 0.35em; }
  .section strong { font-weight: 700; }
  .section a { color: inherit; text-underline-offset: 3px; }
  .section > div > :last-child { margin-bottom: 0; }
  .section .status {
    margin: 0;
    text-align: center;
    font-size: calc(var(--body-size) * 0.8);
    letter-spacing: 0.2em;
    text-transform: uppercase;
    opacity: 0.7;
  }
  /* Phone number and Venmo logo, on the sections named in CONTACT_PAGES. */
  .section .contact {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 20px;
    margin-top: 32px;
  }
  .section .phone {
    font-size: var(--body-size);
    letter-spacing: 0.06em;
    text-decoration: none;
  }
  .section .phone:hover,
  .section .phone:focus-visible { text-decoration: underline; text-underline-offset: 5px; }
  .section .venmo { display: block; width: 160px; max-width: 60vw; height: auto; }

  /* Faint background grid (drawn by the script), optionally fading out
     toward the screen edges. */
  #grid,
  #photos {
    position: absolute;
    left: 0;
    top: 0;
    width: 100%;
    height: 100%;
    pointer-events: none;
  }
  .gallery-off #photos { display: none; }
  .grid-edge-fade #grid {
    -webkit-mask-image: radial-gradient(ellipse at center, #000 25%, transparent 90%);
    mask-image: radial-gradient(ellipse at center, #000 25%, transparent 90%);
  }
  .grid-off #grid,
  .grid-merged #grid { display: none; }

  /* Optional performance panel (SHOW_PERFORMANCE_INFO in settings.md) */
  #perf {
    --perf-blue: #3b64a8;
    position: fixed;
    top: 12px;
    right: 12px;
    z-index: 3;
    display: flex;
    flex-direction: column;
    width: 256px;
    height: 600px;
    max-height: calc(100vh - 24px);
    box-sizing: border-box;
    background: #000;
    border: 1px solid rgba(255, 255, 255, 0.22);
    color: #e5e7eb;
    font: 11px/1.45 Consolas, Menlo, monospace;
    user-select: none;
    -webkit-user-select: none;
    touch-action: none;
    font-variant-numeric: tabular-nums;
  }
  #perf[hidden] { display: none; }
  /* Title bar: drag it to move the window. */
  .perf-head {
    display: flex;
    align-items: center;
    gap: 6px;
    flex: none;
    padding: 5px 6px 5px 12px;
    background: var(--perf-blue);
    color: #fff;
    cursor: move;
    letter-spacing: 0.12em;
    font-size: 10px;
  }
  .perf-hint { margin-left: auto; letter-spacing: 0; opacity: 0.75; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  .perf-body {
    flex: 1;
    min-height: 0;
    overflow: auto;
    padding: 8px 12px 12px;
    /* Still scrolls with the mouse wheel or a finger, just without a visible bar. */
    scrollbar-width: none;
  }
  .perf-body::-webkit-scrollbar { display: none; }
  /* Invisible edges and corners for resizing the window. */
  .perf-rs { position: absolute; z-index: 1; }
  .perf-rs[data-dir="n"], .perf-rs[data-dir="s"] { left: 6px; right: 6px; height: 6px; cursor: ns-resize; }
  .perf-rs[data-dir="e"], .perf-rs[data-dir="w"] { top: 6px; bottom: 6px; width: 6px; cursor: ew-resize; }
  .perf-rs[data-dir="n"] { top: -3px; }
  .perf-rs[data-dir="s"] { bottom: -3px; }
  .perf-rs[data-dir="e"] { right: -3px; }
  .perf-rs[data-dir="w"] { left: -3px; }
  .perf-rs[data-dir="ne"], .perf-rs[data-dir="nw"], .perf-rs[data-dir="se"], .perf-rs[data-dir="sw"] { width: 12px; height: 12px; }
  .perf-rs[data-dir="ne"] { top: -3px; right: -3px; cursor: nesw-resize; }
  .perf-rs[data-dir="sw"] { bottom: -3px; left: -3px; cursor: nesw-resize; }
  .perf-rs[data-dir="nw"] { top: -3px; left: -3px; cursor: nwse-resize; }
  .perf-rs[data-dir="se"] { bottom: -3px; right: -3px; cursor: nwse-resize; }
  .perf-fps {
    display: flex;
    align-items: baseline;
    gap: 6px;
    margin: 4px 0 6px;
  }
  .perf-fps [data-k="fps"] { font-size: 34px; font-weight: bold; line-height: 1; }
  .perf-fps small { color: #9ca3af; font-size: 12px; }
  .perf-rating { margin-left: auto; font-size: 11px; font-weight: bold; letter-spacing: 0.12em; }
  .perf-graph { display: block; width: 100%; height: 56px; border-radius: 4px; }
  .perf-legend {
    display: flex;
    justify-content: space-between;
    margin-top: 2px;
    color: #6b7280;
    font-size: 9px;
  }
  .perf-section {
    margin: 10px -12px 4px;
    padding: 2px 12px;
    background: var(--perf-blue);
    color: #fff;
    font-size: 9px;
    font-weight: bold;
    letter-spacing: 0.14em;
  }
  .perf-row { display: flex; justify-content: space-between; gap: 8px; }
  .perf-row span { color: #9ca3af; white-space: nowrap; }
  .perf-row b { font-weight: normal; color: #f3f4f6; text-align: right; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  #world {
    position: absolute;
    left: 0;
    top: 0;
    transform-origin: 0 0;
    /* Centers the menu before settings load; the script takes over after. */
    transform: translate(50vw, 50vh);
  }
  /* Only while moving: keeps motion smooth, but the browser snapshots the
     layer at one size, so it's switched off at rest to redraw sharply. */
  #world.moving { will-change: transform; }

  /* Centered menu, anchored at world (0,0) */
  #menu {
    position: absolute;
    left: 0;
    top: 0;
    z-index: 1;
    /* At least 900 wide, or as wide as the title if that's wider (the title
       stays on one line). */
    width: max-content;
    min-width: 900px;
    transform: translate(-50%, -50%);
    text-align: center;
  }
  #menu h1 { white-space: nowrap; }
  @media (max-width: 640px) {
    #menu { width: 340px; min-width: 0; }
    #menu h1 { white-space: normal; }
  }
  #menu h1 {
    font-family: var(--heading-font);
    font-weight: var(--heading-weight);
    /* Shrinks on narrow screens so it still fits. */
    font-size: min(var(--title-size, 76px), 12vw);
    line-height: 1.15;
    margin: 0 0 var(--title-gap);
    letter-spacing: 0.02em;
  }
  /* The line under the title (MENU_SUBTITLE). */
  #menu .subtitle {
    max-width: 900px;
    margin: 0 auto var(--title-gap);
    font-size: min(var(--subtitle-size, 24px), 5.5vw);
    line-height: 1.4;
  }
  #menu.has-subtitle h1 { margin-bottom: var(--subtitle-gap, 16px); }
  /* A small notice under the title (HOME_NOTICE): a rounded patch of the
     accent color, with a few words in it. It can lead somewhere, or just
     say something. */
  #menu .notice-line { margin: 0 0 var(--title-gap); line-height: 0; }
  #menu .notice-line[hidden] { display: none; }
  #menu.has-notice .subtitle { margin-bottom: var(--notice-gap, 20px); }
  #menu .notice {
    display: inline-block;
    padding: var(--notice-padding, 10px 20px);
    border-radius: var(--notice-radius, 999px);
    background: var(--accent, #e8f0d4);
    color: var(--fg);
    font-size: min(var(--notice-size, 18px), 5vw);
    line-height: 1.35;
    text-transform: none;
    letter-spacing: 0.02em;
    text-decoration: none;
    white-space: normal;
  }
  #menu .notice[href] { cursor: pointer; transition: filter 180ms ease; }
  #menu .notice[href]:hover,
  #menu .notice[href]:focus-visible { filter: brightness(0.94); }
  #menu .notice em { font-style: italic; }
  #menu .notice strong { font-weight: 700; }
  /* MENU_TITLE_IN_ACCENT_COLOR: the title and the line under it take the
     accent color. */
  #menu.title-accent h1,
  #menu.title-accent .subtitle { color: var(--accent, #e8f0d4); }
  #menu nav {
    display: flex;
    flex-direction: column;
    align-items: center;
    gap: 12px;
  }
  #menu a {
    color: var(--fg);
    text-decoration: none;
    font-size: min(var(--body-size), 6.5vw);
    text-transform: uppercase;
    /* The script widens the sides to cover the spread-out letters, so the
       clickable area never changes size (otherwise it would slip out from
       under the pointer and flicker). */
    padding: 4px 8px;
    cursor: pointer;
    letter-spacing: var(--menu-spacing-hover);
    white-space: nowrap;
    position: relative;
    transition: translate var(--nudge-ms, 300ms) cubic-bezier(0.22, 1, 0.36, 1);
  }
  #menu a:focus-visible { outline: none; }
  /* Underline: grows out from the middle once the letters have settled. */
  #menu.underline a::after {
    content: '';
    position: absolute;
    bottom: 0;
    left: 50%;
    width: var(--word-width, 0px);
    margin-left: calc(var(--word-width, 0px) / -2);
    height: var(--underline-thickness);
    background: currentColor;
    transform: scaleX(0);
    transition: transform var(--underline-ms) cubic-bezier(0.22, 1, 0.36, 1) var(--underline-delay);
  }
  #menu.underline a:hover::after,
  #menu.underline a:focus-visible::after { transform: scaleX(1); }
  #menu.measuring a::after { transition: none; }
  /* Letters sit spread apart and nudged up or down, then settle on hover. */
  .menu-letter {
    display: inline-block;
    transform: translate(var(--dx, 0px), var(--dy, 0px));
    transition: transform var(--ms, var(--menu-spacing-ms)) cubic-bezier(0.22, 1, 0.36, 1) var(--delay, 0ms),
      translate var(--nudge-ms, 300ms) cubic-bezier(0.22, 1, 0.36, 1);
  }
  #menu a:hover .menu-letter,
  #menu a:focus-visible .menu-letter,
  #menu.measuring .menu-letter {
    /* Settled: letters draw together and line up. */
    transform: translate(0, 0);
  }
  #menu.measuring .menu-letter { transition: none; }
  /* Reversed (MENU_HOVER_EXPANDS): letters rest tidy and spread out on hover. */
  #menu.hover-expands .menu-letter { transform: translate(0, 0); }
  #menu.hover-expands a:hover .menu-letter,
  #menu.hover-expands a:focus-visible .menu-letter {
    transform: translate(var(--dx, 0px), var(--dy, 0px));
  }
  /* ...and the underline stretches to the spread-out word. */
  #menu.hover-expands.underline a::after {
    width: calc(var(--word-width, 0px) + 2 * var(--spread-room, 0px));
    margin-left: calc((var(--word-width, 0px) + 2 * var(--spread-room, 0px)) / -2);
  }

  /* Menu bar across the top of the screen: Home and the menu options in a
     row. Shown only once the main menu has been scrolled out of view. On
     screens too narrow for every option, the bar scrolls sideways. */
  #quick-nav {
    position: fixed;
    left: 0;
    top: 0;
    right: 0;
    z-index: 2;
    height: var(--top-menu-height, 56px);
    background: var(--accent, #e8f0d4);
    /* Hidden above the top of the screen; slides down when shown and back
       up when the main menu comes back into view. */
    transform: translateY(-100%);
    visibility: hidden;
    transition: transform var(--top-menu-slide-ms, 350ms) cubic-bezier(0.22, 1, 0.36, 1),
      visibility 0s linear var(--top-menu-slide-ms, 350ms);
  }
  #quick-nav.show {
    transform: translateY(0);
    visibility: visible;
    transition: transform var(--top-menu-slide-ms, 350ms) cubic-bezier(0.22, 1, 0.36, 1), visibility 0s;
  }
  /* TOP_MENU_ANIMATION = false: appear and disappear instantly. */
  .no-top-menu-animation #quick-nav,
  .no-top-menu-animation #quick-nav.show { transition: none; }
  #quick-list {
    display: flex;
    align-items: center;
    justify-content: safe center;
    height: 100%;
    padding: 0 8px;
    box-sizing: border-box;
    overflow-x: auto;
    overflow-y: hidden;
    scrollbar-width: none;
  }
  #quick-list::-webkit-scrollbar { display: none; }
  /* Hovering an option spreads its letters a little, which nudges the
     options beside it aside; they slide back when the pointer leaves. */
  #quick-list a {
    flex: none;
    padding: 8px 14px;
    color: var(--fg);
    font-size: var(--top-menu-text-size, 17px);
    letter-spacing: var(--menu-spacing-hover);
    text-indent: var(--menu-spacing-hover);
    text-transform: uppercase;
    text-decoration: none;
    white-space: nowrap;
    transition: letter-spacing var(--top-menu-hover-ms, 250ms) cubic-bezier(0.22, 1, 0.36, 1),
      text-indent var(--top-menu-hover-ms, 250ms) cubic-bezier(0.22, 1, 0.36, 1),
      translate var(--nudge-ms, 300ms) cubic-bezier(0.22, 1, 0.36, 1);
  }
  #quick-list a:hover,
  #quick-list a:focus-visible {
    letter-spacing: var(--top-menu-hover-spacing, 0.3em);
    text-indent: var(--top-menu-hover-spacing, 0.3em);
  }
  #quick-list a:focus-visible { outline: none; }

  /* Menu bar underline (TOP_MENU_UNDERLINE_ON_HOVER): two halves that grow
     out from the middle of the word on hover. When the word leans up on its
     way to a section above (TOP_MENU_ARROW_WHEN_MOVING_UP), the halves
     shorten and tilt up to meet in the middle: a small arrow under the word,
     pointing the way the page is going. */
  #quick-list a { position: relative; }
  #quick-list.underline a::before,
  #quick-list.underline a::after {
    content: '';
    position: absolute;
    bottom: 3px;
    /* Ends line up with the first and last letters (the hovered letter
       spacing leaves that much space outside them). */
    width: calc(50% - 14px - var(--top-menu-hover-spacing, 0.3em));
    height: var(--top-underline-thickness, 2px);
    background: currentColor;
    transform: scaleX(0);
    transition: transform var(--top-menu-hover-ms, 250ms) cubic-bezier(0.22, 1, 0.36, 1),
      width var(--top-menu-hover-ms, 250ms) cubic-bezier(0.22, 1, 0.36, 1);
  }
  /* Only the outer ends are rounded, so the halves meet without a notch. */
  #quick-list.underline a::before { right: 50%; transform-origin: 100% 50%; border-radius: 99px 0 0 99px; }
  #quick-list.underline a::after { left: 50%; transform-origin: 0 50%; border-radius: 0 99px 99px 0; }
  #quick-list.underline a:hover::before,
  #quick-list.underline a:hover::after,
  #quick-list.underline a:focus-visible::before,
  #quick-list.underline a:focus-visible::after { transform: scaleX(1); }
  #quick-list.underline.arrow-up a.nudged.heading-up::before,
  #quick-list.underline.arrow-up a.nudged.heading-up::after { width: var(--top-arrow-half, 10px); }
  #quick-list.underline.arrow-up a.nudged.heading-up::before { transform: rotate(-40deg); }
  #quick-list.underline.arrow-up a.nudged.heading-up::after { transform: rotate(40deg); }

  /* A chosen menu option's letters jump to scattered heights and stay there
     while the page glides to its section, then drop back into line
     (MENU_CLICK_NUDGE). Uses the separate translate property, so it adds to
     the hover movement instead of replacing it. */
  .menu-letter,
  .bar-letter {
    translate: 0 0;
  }
  .bar-letter { display: inline-block; text-indent: 0; transition: translate var(--nudge-ms, 300ms) cubic-bezier(0.22, 1, 0.36, 1); }
  .nudged .menu-letter,
  .nudged .bar-letter { translate: var(--nx, 0px) var(--ny, 0px); }
  /* MENU_CLICK_MOVE_TOWARD_SECTION: the whole word leans the way the page
     is heading (down to a section below, up to one above). */
  #menu a,
  #quick-list a { translate: 0 0; }
  #menu a.nudged.heading-down,
  #quick-list a.nudged.heading-down { translate: 0 var(--word-shift, 0.4em); }
  #menu a.nudged.heading-up,
  #quick-list a.nudged.heading-up { translate: 0 calc(-1 * var(--word-shift, 0.4em)); }

  /* A menu option glows briefly when it's clicked (MENU_CLICK_GLOW). */
  @keyframes menu-glow {
    0% { text-shadow: 0 0 0 transparent; }
    20% { text-shadow: 0 0 6px var(--glow-color), 0 0 14px var(--glow-color), 0 0 28px var(--glow-color); }
    100% { text-shadow: 0 0 0 transparent; }
  }
  #menu a.glow,
  #quick-list a.glow { animation: menu-glow var(--glow-ms, 1200ms) ease-out; }

  /* Gallery switched off in settings.md: a plain, normal webpage. */
  html.gallery-off,
  html.gallery-off body {
    height: auto;
    overflow: auto;
  }
  .gallery-off #viewport {
    position: relative;
    display: flex;
    align-items: center;
    justify-content: center;
    min-height: 100vh;
    min-height: 100dvh;
    padding: 48px 16px;
    box-sizing: border-box;
    cursor: auto;
    touch-action: auto;
    user-select: auto;
    -webkit-user-select: auto;
  }
  .gallery-off #world {
    position: relative; /* keeps the menu above the grid */
    transform: none;
  }
  .gallery-off #menu {
    position: static;
    transform: none;
    width: auto;
    max-width: 900px;
  }
  .gallery-off #quick-nav { display: none; }
</style>

<script src="markdown.js"></script>
<script>
// ---- Settings ---------------------------------------------------------------
// All tunable values live in settings.md, as `NAME = value` lines inside
// ``` code blocks (the text around them is notes for people). It's fetched
// from the server, so it only loads when the site is served (localhost or
// online). Anything missing or invalid falls back to the defaults below.
// A word settings.md can use: LAYOUT_SEED = random
window.random = 'random';

function loadSettings() {
  return fetch('settings.md', { cache: 'no-cache' })
    .then((r) => (r.ok ? r.text() : Promise.reject(new Error('HTTP ' + r.status))))
    .then((text) => {
      // Only the ``` code blocks are settings; the rest is notes. Each block
      // runs on its own, so a mistake in one only skips that block.
      const blocks = [...text.replace(/\r\n?/g, '\n').matchAll(/^```[^\n]*\n([\s\S]*?)^```/gm)];
      for (const [, code] of blocks) {
        try {
          (0, eval)(code); // runs as plain page-wide code: NAME = value sets NAME
        } catch (err) {
          console.error('settings.md: skipped a code block with a mistake (' + err.message + '):\n' + code);
        }
      }
    })
    .catch((err) => console.warn('settings.md could not be loaded (' + err.message + '); using the built-in defaults.'));
}

const clamp = (v, lo, hi) => Math.min(hi, Math.max(lo, v));

// Menu option name -> its page file name: "Parent-Learning" ->
// "parent-learning", "FAQs" -> "faqs". Must match pageSlug() in page.js.
function pageSlug(name) {
  return String(name).trim().toLowerCase().replace(/[^a-z0-9]+/g, '-').replace(/^-+|-+$/g, '');
}

// Does this address lead to the play's page? With PLAY_PAGE_ENABLED off,
// anything that does is hidden. Must match leadsToPlay() in page.js.
function leadsToPlay(address) {
  return /(^|\/)is_nirmal_normal(\.html)?([?#]|$)/i.test(String(address).trim());
}

function setting(name, fallback) {
  const value = window[name];
  if (value === undefined) return fallback;
  const ok = typeof fallback === 'number' ? Number.isFinite(value)
    : Array.isArray(fallback) ? Array.isArray(value)
    : typeof value === typeof fallback;
  if (!ok) {
    console.warn(`settings.md: ${name} has an invalid value; using ${JSON.stringify(fallback)}.`);
    return fallback;
  }
  return value;
}

function startGallery() {
  const IMAGE_DIR = setting('PHOTO_FOLDER', 'photos/infinite_gallery/');
  // Small copies of the photos, used instead of the originals: a photo the
  // size of a postcard on screen doesn't need a 10 MB camera file. Each is
  // the photo's name with .jpg on the end. A photo with no small copy falls
  // back to the original, so a new photo still shows up straight away.
  const SMALL_DIR = String(setting('PHOTO_SMALL_FOLDER', 'assets/small/')).trim();
  const photoSrc = (file) => (SMALL_DIR ? SMALL_DIR + file.replace(/\.[^.]+$/, '.jpg') : IMAGE_DIR + file);
  const IMAGES = setting('PHOTOS', []);
  const SIZE_MIN = setting('PHOTO_SIZE_SMALLEST', 110);
  const SIZE_MAX = Math.max(SIZE_MIN, setting('PHOTO_SIZE_LARGEST', 270));
  const FADE_IN_MS = setting('PHOTO_FADE_IN_MS', 500);
  const GAP_MIN = setting('SPACING_NEAR_MENU_MIN', 15);
  const GAP_MAX = Math.max(GAP_MIN, setting('SPACING_NEAR_MENU_MAX', 60));
  const EDGE_MULTIPLIER = Math.max(1, setting('SPACING_AT_EDGE_MULTIPLIER', 3));
  const CROWDED_RADIUS = Math.max(0, setting('CROWDED_AREA_RADIUS', 1500));
  const END_DISTANCE = Math.max(CROWDED_RADIUS + 1, setting('PHOTOS_END_DISTANCE', 12000));
  const FADE_CURVE = Math.max(0.1, setting('FADE_CURVE', 1));
  const CENTER_DENSITY = clamp(setting('CROWDED_AREA_DENSITY', 100), 0, 100) / 100;
  const TRIES_PER_AREA = setting('PLACEMENT_TRIES', 250);
  const MENU_GAP = setting('MENU_CLEARANCE', 40);
  // LAYOUT_SEED is a number, or the word random for a fresh arrangement on
  // every visit.
  const seedSetting = window.LAYOUT_SEED;
  const SEED = Number.isFinite(seedSetting) ? seedSetting | 0 : Math.floor(Math.random() * 2147483647);
  const FRAME_PADDING = setting('FRAME_PADDING', 6);
  const FRAME_BORDER = setting('FRAME_BORDER_WIDTH', 1);
  const MIN_SCALE = 1 / Math.max(1, setting('ZOOM_OUT_LIMIT', 3));
  const MAX_SCALE = Math.max(1, setting('ZOOM_IN_LIMIT', 3));
  const WHEEL_SPEED = setting('WHEEL_ZOOM_SPEED', 0.0015);
  // The play's page on or off (PLAY_PAGE_ENABLED): when off, the notice and
  // any menu option leading to it are hidden.
  const PLAY_OFF = setting('PLAY_PAGE_ENABLED', true) === false;
  // Read mode: a linear page, scrolled up and down only. Explore mode: pan in
  // any direction and zoom in and out.
  const GALLERY_ON = setting('GALLERY_ENABLED', true);
  const READ_MODE = String(setting('GALLERY_MODE', 'read')).trim().toLowerCase() !== 'explore';
  document.documentElement.classList.toggle('read-mode', READ_MODE);
  const PINCH_SPEED = setting('TRACKPAD_PINCH_ZOOM_SPEED', 0.01);
  const GLIDE = clamp(setting('GLIDE_AFTER_DRAG', 0.94), 0, 0.99);
  const KEY_STEP = setting('KEYBOARD_MOVE_STEP', 120);
  const HOME_MS = Math.max(1, setting('HOME_TRAVEL_MS', 800));
  const ABOVE_HOME = Math.max(0, setting('READ_MODE_SCROLL_ABOVE_HOME', 0));
  // How far below the last section the page may be scrolled. The photos
  // carry on fading out below it, but the page stops here.
  const BELOW_END = Math.max(0, setting('READ_MODE_SCROLL_BELOW_SECTIONS', 1200));
  // A line of words at the very end of the page, in italics.
  const END_QUOTE = String(setting('END_QUOTE', '')).trim();
  const END_QUOTE_ABOVE = Math.max(0, setting('END_QUOTE_ABOVE_BOTTOM', 200));
  // Read mode's sections of text, and the room for photos between them.
  const SECTION_SPACE = Math.max(0, setting('SPACE_BETWEEN_SECTIONS', 400));
  const SECTION_CLEARANCE = Math.max(0, setting('SECTION_PHOTO_CLEARANCE', 40));
  const SECTION_THIN = Math.max(1, setting('SECTION_PHOTO_THIN_OUT_DISTANCE', 10500));
  const SMOOTH_LINKS = setting('SECTION_LINKS_SCROLL_SMOOTHLY', true);
  const SECTION_SCROLL_MS = Math.max(0, setting('SECTION_SCROLL_MS', 1000));
  const SECTION_MARGIN = Math.max(0, setting('SECTION_SCROLL_MARGIN', 96));
  document.documentElement.classList.toggle('no-top-menu-animation', !setting('TOP_MENU_ANIMATION', true));
  // Rounded photo corners: a size in pixels, or a percentage of each photo's
  // shorter side.
  const CORNERS_ON = setting('PHOTO_ROUNDED_CORNERS', true);
  const CORNER_RADIUS = Math.max(0, setting('PHOTO_CORNER_RADIUS', 12));
  const CORNER_PERCENT = String(setting('PHOTO_CORNER_RADIUS_UNIT', 'pixels')).trim().toLowerCase().startsWith('percent');

  const rootStyle = document.documentElement.style;
  rootStyle.setProperty('--accent', setting('ACCENT_COLOR', '#e8f0d4'));
  rootStyle.setProperty('--top-menu-slide-ms', Math.max(0, setting('TOP_MENU_SLIDE_MS', 350)) + 'ms');
  rootStyle.setProperty('--top-menu-height', Math.max(24, setting('TOP_MENU_HEIGHT', 64)) + 'px');
  rootStyle.setProperty('--top-menu-text-size', Math.max(8, setting('TOP_MENU_TEXT_SIZE', 17)) + 'px');
  rootStyle.setProperty('--top-menu-hover-spacing', setting('TOP_MENU_HOVER_LETTER_SPACING', 0.3) + 'em');
  rootStyle.setProperty('--top-menu-hover-ms', Math.max(0, setting('TOP_MENU_HOVER_SPEED_MS', 250)) + 'ms');
  rootStyle.setProperty('--top-underline-thickness', Math.max(0, setting('TOP_MENU_UNDERLINE_THICKNESS', 2)) + 'px');
  rootStyle.setProperty('--top-arrow-half', Math.max(1, setting('TOP_MENU_ARROW_SIZE', 10)) + 'px');
  const quickListEl = document.getElementById('quick-list');
  quickListEl.classList.toggle('underline', setting('TOP_MENU_UNDERLINE_ON_HOVER', true));
  quickListEl.classList.toggle('arrow-up', setting('TOP_MENU_ARROW_WHEN_MOVING_UP', true));
  rootStyle.setProperty('--bg', setting('BACKGROUND_COLOR', '#000000'));
  rootStyle.setProperty('--fg', setting('TEXT_COLOR', '#ffffff'));

  // Fonts come from Google Fonts by name, so any family listed there works.
  const HEADING_FONT = setting('HEADING_FONT', 'Lora');
  const HEADING_WEIGHT = setting('HEADING_FONT_WEIGHT', 600);
  const BODY_FONT = setting('BODY_FONT', 'Quicksand');
  const BODY_WEIGHT = setting('BODY_FONT_WEIGHT', 500);
  // Asking Google Fonts for a weight a family doesn't have gets the whole
  // family turned down, and the words then fall back to Georgia or Segoe UI
  // with nothing said about it. So each family is checked once the sheet has
  // arrived, and any that didn't turn up is asked for again without naming a
  // weight. (Same as loadGoogleFonts in page.js, which this page doesn't load.)
  const askForFonts = (wanted) => {
    const listed = wanted.filter((f) => f && f.family);
    if (!listed.length) return;
    const address = (parts) => 'https://fonts.googleapis.com/css2?' + parts.map((p) =>
      'family=' + encodeURIComponent(p.family) +
      (p.weights && p.weights.length ? ':wght@' + p.weights.join(';') : '')).join('&') + '&display=swap';
    const add = (url) => {
      const link = document.createElement('link');
      link.rel = 'stylesheet';
      link.href = url;
      document.head.appendChild(link);
      return link;
    };
    const facesOf = (family) => [...(document.fonts || [])]
      .filter((f) => String(f.family).replace(/^["']|["']$/g, '') === family);
    const hasWeight = (faces, want) => faces.some((f) => {
      const ends = String(f.weight).split(/\s+/).map(Number);
      return ends.length > 1 ? want >= ends[0] && want <= ends[1] : ends[0] === want;
    });
    const first = add(address(listed));
    const checkUp = () => {
      if (!document.fonts) return;
      const trouble = [];
      for (const p of listed) {
        const faces = facesOf(p.family);
        const absent = faces.length
          ? (p.weights || []).filter((w) => !hasWeight(faces, Number(w)))
          : (p.weights || []);
        if (!faces.length || absent.length) trouble.push({ family: p.family, absent, came: faces.length > 0 });
      }
      if (!trouble.length) return;
      const again = add(address(trouble.map((p) => ({ family: p.family }))));
      const lastWord = () => {
        for (const p of trouble) {
          const faces = facesOf(p.family);
          if (!faces.length) {
            console.warn('There is no font called "' + p.family + '" on Google Fonts, so the page fell ' +
              'back to its ordinary font. Check the spelling against fonts.google.com — it has to match exactly.');
          } else {
            const have = [...new Set(faces.map((f) => String(f.weight)))].join(', ');
            console.warn('The font "' + p.family + '" hasn\'t got weight ' + p.absent.join(' or ') +
              ' on Google Fonts. It has ' + have + ', and the nearest of those is being used instead.');
          }
        }
      };
      again.addEventListener('load', lastWord);
      again.addEventListener('error', lastWord);
    };
    first.addEventListener('load', checkUp);
    first.addEventListener('error', checkUp);
  };
  askForFonts([
    { family: HEADING_FONT, weights: [HEADING_WEIGHT] },
    // Bold (700) is also loaded for the bold words in the sections' text.
    { family: BODY_FONT, weights: [...new Set([BODY_WEIGHT, 700])].sort((a, b) => a - b) },
  ]);
  rootStyle.setProperty('--heading-font', `'${HEADING_FONT}', Georgia, serif`);
  rootStyle.setProperty('--heading-weight', HEADING_WEIGHT);
  rootStyle.setProperty('--body-font', `'${BODY_FONT}', 'Segoe UI', sans-serif`);
  rootStyle.setProperty('--body-weight', BODY_WEIGHT);
  rootStyle.setProperty('--heading-size', Math.max(8, setting('HEADING_FONT_SIZE', 64)) + 'px');
  rootStyle.setProperty('--body-size', Math.max(8, setting('BODY_FONT_SIZE', 24)) + 'px');
  // Two columns in a section file (Role — Name): how far apart they sit, and
  // whether the dash between them shows.
  // The scrollbar down the side of the window.
  document.documentElement.classList.toggle('show-scrollbar', setting('SHOW_SCROLLBAR', false) === true);
  rootStyle.setProperty('--pair-gap', Math.max(0, setting('TWO_COLUMN_GAP', 64)) + 'px');
  // The mark that stands in the gutter: false or "" for none, true for an em
  // dash, or any characters of your own. This one is read straight from the
  // settings rather than through setting(), which keeps a value only when it
  // is the same kind of thing as the fallback — and this one is deliberately
  // either a yes/no or some words.
  const gutterMark = window.TWO_COLUMN_DASH;
  const markText = gutterMark === true ? '—' : (typeof gutterMark === 'string' ? gutterMark : '');
  document.documentElement.classList.toggle('two-column-dash', markText !== '');
  if (markText) rootStyle.setProperty('--pair-dash-char', JSON.stringify(markText));
  rootStyle.setProperty('--section-width', Math.max(200, setting('SECTION_TEXT_WIDTH', 720)) + 'px');
  rootStyle.setProperty('--section-heading-size', Math.max(8, setting('SECTION_HEADING_SIZE', 44)) + 'px');
  rootStyle.setProperty('--section-text-size', Math.max(8, setting('SECTION_TEXT_SIZE', 19)) + 'px');
  rootStyle.setProperty('--end-quote-size', Math.max(8, setting('END_QUOTE_SIZE', 24)) + 'px');
  // 0 = paragraphs are as wide as the section; anything else narrows them.
  const PARAGRAPH_WIDTH = Math.max(0, setting('SECTION_PARAGRAPH_WIDTH', 0));
  rootStyle.setProperty('--paragraph-width', PARAGRAPH_WIDTH ? PARAGRAPH_WIDTH + 'px' : 'none');
  rootStyle.setProperty('--section-image-width', Math.max(20, setting('SECTION_PICTURE_WIDTH', 200)) + 'px');
  // 0 = as tall as the picture works out; any other number sets the height.
  const PICTURE_HEIGHT = Math.max(0, setting('SECTION_PICTURE_HEIGHT', 0));
  rootStyle.setProperty('--section-image-height', PICTURE_HEIGHT + 'px');
  rootStyle.setProperty('--section-image-radius', (setting('PHOTO_ROUNDED_CORNERS', true) ? Math.max(0, setting('PHOTO_CORNER_RADIUS', 12)) : 0) +
    (String(setting('PHOTO_CORNER_RADIUS_UNIT', 'pixels')).trim().toLowerCase().startsWith('percent') ? '%' : 'px'));
  rootStyle.setProperty('--section-scroll-margin', Math.max(0, setting('SECTION_SCROLL_MARGIN', 96)) + 'px');
  rootStyle.setProperty('--title-gap', Math.max(0, setting('TITLE_GAP', 72)) + 'px');
  rootStyle.setProperty('--title-size', Math.max(8, setting('MENU_TITLE_SIZE', 76)) + 'px');
  rootStyle.setProperty('--subtitle-size', Math.max(8, setting('MENU_SUBTITLE_SIZE', 24)) + 'px');
  rootStyle.setProperty('--subtitle-gap', Math.max(0, setting('SUBTITLE_GAP', 16)) + 'px');
  rootStyle.setProperty('--menu-spacing-start', setting('MENU_LETTER_SPACING', 0.3) + 'em');
  rootStyle.setProperty('--menu-spacing-hover', setting('MENU_LETTER_SPACING_HOVER', 0.06) + 'em');
  rootStyle.setProperty('--menu-spacing-ms', Math.max(0, setting('MENU_HOVER_SPEED_MS', 450)) + 'ms');

  // Title and menu options come from settings.md (the text written in the
  // page itself is only a fallback). Blank entries are skipped.
  const menuEl = document.getElementById('menu');
  const title = String(setting('MENU_TITLE', '')).trim();
  if (title) menuEl.querySelector('h1').textContent = title;
  const subtitle = String(setting('MENU_SUBTITLE', '')).trim();
  const subtitleEl = menuEl.querySelector('.subtitle');
  subtitleEl.textContent = subtitle;
  subtitleEl.hidden = !subtitle;
  menuEl.classList.toggle('has-subtitle', !!subtitle);

  // The notice under the title: its words, where it leads, and its size.
  const noticeLink = String(setting('HOME_NOTICE_LINK', '')).trim();
  // A notice leading to the play's page goes when the play's page is off.
  const noticeText = PLAY_OFF && leadsToPlay(noticeLink) ? '' : String(setting('HOME_NOTICE', '')).trim();
  const noticeEl = document.getElementById('notice');
  rootStyle.setProperty('--notice-size', Math.max(8, setting('HOME_NOTICE_TEXT_SIZE', 18)) + 'px');
  rootStyle.setProperty('--notice-gap', Math.max(0, setting('HOME_NOTICE_GAP', 20)) + 'px');
  if (noticeText) {
    // Written like the section files, so **bold** and *italic* work; it's
    // one line, so the paragraph it comes back in is unwrapped.
    noticeEl.innerHTML = typeof markdownToHtml === 'function'
      ? markdownToHtml(noticeText).replace(/^<p>|<\/p>$/g, '')
      : noticeText;
    if (noticeLink) {
      noticeEl.href = noticeLink;
      if (/^https?:/i.test(noticeLink)) {
        noticeEl.target = '_blank';
        noticeEl.rel = 'noopener';
      }
    } else {
      noticeEl.removeAttribute('href');
    }
    noticeEl.parentNode.hidden = false;
  }
  menuEl.classList.toggle('has-notice', !!noticeText);
  menuEl.classList.toggle('title-accent', setting('MENU_TITLE_IN_ACCENT_COLOR', true));
  const LETTER_SPREAD = setting('MENU_LETTERS_SPREAD_SIDEWAYS', true)
    ? Math.max(0, setting('MENU_LETTER_SPACING', 0.3) - setting('MENU_LETTER_SPACING_HOVER', 0.06)) : 0;
  const LETTER_OFFSET = setting('MENU_LETTERS_NUDGE_UP_DOWN', true)
    ? Math.max(0, setting('MENU_LETTER_OFFSET', 0.12)) : 0;
  const HOVER_MS = Math.max(0, setting('MENU_HOVER_SPEED_MS', 450));
  const EVEN_SPEED = setting('MENU_LETTERS_EVEN_SPEED', true);
  const STAGGER_MS = Math.max(0, setting('MENU_LETTER_STAGGER_MS', 70));
  const UNDERLINE_DELAY = Math.max(0, setting('MENU_UNDERLINE_DELAY_MS', 80));
  menuEl.classList.toggle('underline', setting('MENU_UNDERLINE_ON_HOVER', true));
  menuEl.classList.toggle('hover-expands', setting('MENU_HOVER_EXPANDS', false));
  rootStyle.setProperty('--underline-thickness', Math.max(0, setting('MENU_UNDERLINE_THICKNESS', 1)) + 'px');
  rootStyle.setProperty('--underline-ms', Math.max(0, setting('MENU_UNDERLINE_SPEED_MS', 220)) + 'ms');
  rootStyle.setProperty('--underline-delay', UNDERLINE_DELAY + 'ms');
  // MENU_LETTER_SEED is a number, or the word random for a fresh scatter on
  // every visit (the same idea as LAYOUT_SEED).
  const letterSeedSetting = window.MENU_LETTER_SEED;
  const LETTER_SEED = Number.isFinite(letterSeedSetting) ? letterSeedSetting | 0 : Math.floor(Math.random() * 2147483647);

  // Split an option into letters that each sit a little out of place, then
  // slide home on hover. Moving them this way (rather than by changing the
  // spacing) keeps the option exactly the same size at all times, so it stays
  // centered and can't flicker under the pointer.
  let farthestTravel = 1;
  function letterTravel(chars, spread, jitter) {
    return Math.hypot(((chars - 1) / 2) * spread, jitter);
  }

  function layOutLetters(link, linkIndex) {
    const label = link.dataset.label || link.textContent;
    link.dataset.label = label;
    const chars = [...label];
    const size = parseFloat(getComputedStyle(link).fontSize) || 18;
    const spread = LETTER_SPREAD * size;   // extra gap per letter, at rest
    const jitter = LETTER_OFFSET * size;   // how far up or down each letter starts

    // Deterministic per letter, so a page never redraws differently.
    const wobble = (i) => {
      let h = Math.imul(i + 1, 2654435761) ^ Math.imul(linkIndex + 1, 374761393) ^ Math.imul(LETTER_SEED, 2246822519);
      h = Math.imul(h ^ (h >>> 15), 2246822519);
      h = Math.imul(h ^ (h >>> 13), 3266489917);
      return (((h ^ (h >>> 16)) >>> 0) / 4294967296) * 2 - 1;
    };

    const shifts = chars.map((ch, i) => (i - (chars.length - 1) / 2) * spread);
    const middle = shifts.reduce((a, b) => a + b, 0) / (shifts.length || 1);
    let settledAt = 0;
    link.replaceChildren(...chars.map((ch, i) => {
      const span = document.createElement('span');
      span.className = 'menu-letter';
      span.textContent = ch === ' ' ? '\u00a0' : ch;
      const dx = shifts[i] - middle, dy = wobble(i) * jitter;
      span.style.setProperty('--dx', dx.toFixed(2) + 'px');
      span.style.setProperty('--dy', dy.toFixed(2) + 'px');
      // Same speed for every letter: time in proportion to distance.
      // Even speed: time in proportion to distance. Otherwise every letter
      // takes the same time (the original behavior).
      const ms = EVEN_SPEED ? Math.max(40, Math.round(HOVER_MS * Math.hypot(dx, dy) / farthestTravel)) : HOVER_MS;
      // Each letter can start a little after the others (0 = all together).
      const delay = Math.round(Math.abs(wobble(i)) * STAGGER_MS);
      span.style.setProperty('--ms', ms + 'ms');
      span.style.setProperty('--delay', delay + 'ms');
      settledAt = Math.max(settledAt, ms + delay);
      return span;
    }));
    // The underline waits for this option's own letters to settle.
    link.style.setProperty('--underline-delay', settledAt + UNDERLINE_DELAY + 'ms');
    // Room for the spread-out letters, so the option's size never changes.
    const room = Math.max(...shifts.map((v) => Math.abs(v - middle)));
    link.style.setProperty('--spread-room', room.toFixed(1) + 'px');
    link.style.paddingLeft = link.style.paddingRight = (8 + room).toFixed(1) + 'px';
  }

  // Line each option up with the middle of the menu. Letter spacing leaves a
  // gap after the last letter, so the text alone would sit slightly off.
  function centerLetters(links) {
    const middle = menuEl.getBoundingClientRect();
    const mid = middle.left + middle.width / 2;
    menuEl.classList.add('measuring'); // measure the settled positions
    for (const link of links) {
      link.style.transform = 'none';
      const boxes = [...link.querySelectorAll('.menu-letter')].map((el) => el.getBoundingClientRect());
      if (!boxes.length) continue;
      const left = Math.min(...boxes.map((b) => b.left)), right = Math.max(...boxes.map((b) => b.right));
      link.style.transform = `translateX(${(mid - (left + right) / 2).toFixed(2)}px)`;
      link.style.setProperty('--word-width', (right - left).toFixed(1) + 'px');
    }
    menuEl.classList.remove('measuring');
  }

  // Menu options that open an address of their own (MENU_LINKS) instead of
  // a section on this page: the payments page, say.
  const OPTION_LINKS = setting('MENU_LINKS', {});
  const optionLink = (label) => String(OPTION_LINKS[label] || '').trim();
  // An option leading to the play's page is left out while that page is off.
  const shown = (label) => !(PLAY_OFF && leadsToPlay(optionLink(label)));
  const items = setting('MENU_ITEMS', []).map((item) => String(item).trim()).filter(Boolean).filter(shown);
  if (items.length) {
    menuEl.querySelector('nav').replaceChildren(...items.map((label) => {
      const link = document.createElement('a');
      // Read mode: jump to the option's section further down this page.
      // Otherwise (explore mode, gallery off): open its own page.
      // Read mode: jump to the option's section further down this page.
      // An option with its own address in MENU_LINKS goes there instead.
      link.href = optionLink(label) ||
        (READ_MODE && GALLERY_ON ? '#' + pageSlug(label) : pageSlug(label) + '.html');
      link.textContent = label;
      return link;
    }));
  }
  const menuLinks = [...menuEl.querySelectorAll('nav a')];
  // Split a group of options into moving letters. Each group measures its own
  // longest option, so even speed works within the group.
  function layOutGroup(links, seedOffset) {
    if (!links.length) return;
    const size = parseFloat(getComputedStyle(links[0]).fontSize) || 18;
    const longest = Math.max(...links.map((a) => (a.dataset.label || a.textContent).length), 1);
    farthestTravel = Math.max(1, letterTravel(longest, LETTER_SPREAD * size, LETTER_OFFSET * size));
    links.forEach((link, i) => layOutLetters(link, i + seedOffset));
  }
  // What sits in the middle of the screen at Home. The whole block — title,
  // tagline, notice and options together — is centered on the world's
  // origin, which leaves the options themselves low, since everything above
  // them is taller than the options are. Centering on the options instead
  // means lifting the block by however far the options sit below its middle.
  //
  // The lift is made of empty space added under the options rather than a
  // nudge upward, so the block's box still holds everything in it: photos go
  // on keeping away from the whole of it, the way they always have.
  const CENTER_ON = String(setting('MENU_CENTER_ON', 'options')).trim().toLowerCase();
  let menuLift = 0;
  // Worked out from the block's own layout rather than from where it happens
  // to be on screen, so it doesn't depend on the page having settled or on
  // how far it is scrolled. The block is centered on its box, so with space
  // P added underneath, the options end up at the middle when
  // P = 2 x (how far the options' middle is from the top) - the height
  // without that space.
  function liftMenu() {
    menuEl.style.paddingBottom = '';
    menuLift = 0;
    const nav = menuEl.querySelector('nav');
    if (CENTER_ON !== 'options' || !nav || !nav.offsetHeight) return;
    const fromTop = nav.offsetTop + nav.offsetHeight / 2;
    menuLift = Math.max(0, Math.round(fromTop - menuEl.offsetHeight / 2));
    if (menuLift) menuEl.style.paddingBottom = menuLift * 2 + 'px';
  }

  const layOutMenu = () => {
    layOutGroup(menuLinks, 0);
    centerLetters(menuLinks);
    liftMenu();
  };
  layOutMenu();
  // Letter widths change once the real font arrives.
  if (document.fonts) document.fonts.ready.then(layOutMenu);
  const FRAME_COLOR = setting('FRAME_BORDER_COLOR', 'rgba(255, 255, 255, 0.35)');
  const FRAME_FILL = setting('FRAME_FILL_COLOR', '#0b0b0b');
  rootStyle.setProperty('--frame', FRAME_COLOR);

  // Match a canvas's pixel buffer to its on-screen size at the given pixel
  // density, and reset it for drawing in CSS pixels.
  function prepareCanvas(canvas, ctx, dpr) {
    const w = canvas.clientWidth, h = canvas.clientHeight;
    const bw = Math.max(1, Math.round(w * dpr)), bh = Math.max(1, Math.round(h * dpr));
    if (canvas.width !== bw || canvas.height !== bh) {
      canvas.width = bw;
      canvas.height = bh;
    }
    ctx.setTransform(bw / Math.max(1, w), 0, 0, bh / Math.max(1, h), 0, 0);
    ctx.clearRect(0, 0, w, h);
    return { w, h };
  }

  // ---- Background grid ----------------------------------------------------
  // Filled as one shape per redraw, so crossings aren't painted twice
  // (semi-transparent CSS stripes made them brighter). The grid scales with
  // zoom like everything else, lines included.
  const GRID_ON = setting('GRID_ENABLED', true);
  const GRID_SIZE = Math.max(4, setting('GRID_SQUARE_SIZE', 80));
  const GRID_LINE = Math.max(0, setting('GRID_LINE_THICKNESS', 1));
  const GRID_COLOR = setting('GRID_LINE_COLOR', 'rgba(255, 255, 255, 0.07)');
  const GRID_EDGE_FADE = setting('GRID_FADES_AT_EDGES', true);
  const gridCanvas = document.getElementById('grid');
  const gridCtx = gridCanvas.getContext('2d');
  document.documentElement.classList.toggle('grid-off', !GRID_ON);
  document.documentElement.classList.toggle('grid-edge-fade', GRID_EDGE_FADE);

  // (originX, originY) is where a grid crossing lands on screen; scale is the zoom.
  function paintGrid(ctx, w, h, originX, originY, scale) {
    const step = GRID_SIZE * scale;
    const width = GRID_LINE * scale;
    if (width <= 0) return;
    ctx.fillStyle = GRID_COLOR;
    if (step < 6) {
      // Lines this close together read as an even haze: one fill with the
      // same average brightness looks the same and is far cheaper.
      const r = Math.min(1, GRID_LINE / GRID_SIZE);
      ctx.globalAlpha = 1 - (1 - r) * (1 - r);
      ctx.fillRect(0, 0, w, h);
      ctx.globalAlpha = 1;
      return;
    }
    ctx.beginPath();
    for (let x = ((originX % step) + step) % step; x < w + step; x += step) {
      ctx.rect(x - width / 2, 0, width, h);
    }
    for (let y = ((originY % step) + step) % step; y < h + step; y += step) {
      ctx.rect(0, y - width / 2, w, width);
    }
    ctx.fill();
  }

  if (!GALLERY_ON) {
    document.documentElement.classList.add('gallery-off');
    const drawStill = () => {
      if (!GRID_ON) return;
      const { w, h } = prepareCanvas(gridCanvas, gridCtx, window.devicePixelRatio || 1);
      paintGrid(gridCtx, w, h, w / 2, h / 2, 1);
    };
    drawStill();
    window.addEventListener('resize', drawStill);
    return;
  }

  // With the gallery on, the grid is drawn into the photo canvas (one layer
  // for the browser to update instead of two), unless the edge fade needs it
  // on a layer of its own.
  const GRID_SEPARATE = GRID_EDGE_FADE;
  document.documentElement.classList.toggle('grid-merged', GRID_ON && !GRID_SEPARATE);

  let perfOn = setting('SHOW_PERFORMANCE_INFO', false); // Ctrl+P can switch it on later
  const PERF_RATING = setting('SHOW_PERFORMANCE_RATING', false);
  const TILES_ON = setting('SPEED_UP_ZOOMED_OUT_VIEW', true);
  const LOW_RES_MOVING = setting('LOWER_RESOLUTION_WHILE_MOVING', true);

  // ---- Layout -------------------------------------------------------------
  // The landscape is split into square chunks. Each chunk scatters photos at
  // random spots, keeping any that don't crowd the photos already placed.
  // Every photo wants its own random amount of space around it.
  //
  // Density by distance from the menu: fully crowded out to CROWDED_RADIUS,
  // then thinning out until nothing remains at END_DISTANCE. Two things do
  // the thinning: spacing widens, and a growing share of the placed photos
  // is removed (spacing alone barely shows, since placement fills any room).
  const FRAME = FRAME_PADDING + FRAME_BORDER;
  // Farthest apart (center to center, along one axis) two photos can be and
  // still affect each other. Chunks must be at least this big.
  const REACH = SIZE_MAX + 2 * FRAME + GAP_MAX * EDGE_MULTIPLIER;
  const CHUNK = Math.max(1000, Math.ceil(REACH * 1.05));
  const ATTEMPTS = Math.round(TRIES_PER_AREA * (CHUNK / 1000) ** 2);

  // Read mode's sections of text: the area each one covers (in landscape
  // units, clearance included), centred on the menu's line, where no photo
  // may go. Photos can still sit beside the text.
  //
  // With sections, photos are crowded only around the menu, down to the top
  // of the first section (fadeStart). From there they thin out gradually,
  // reaching nothing after fadeLength: SECTION_THIN, stretched if needed so
  // about a third of the crowded amount is still left by the last section
  // (contentBottom).
  let textBands = [];   // { hx, y0, y1 }: half-width, top, bottom
  let contentBottom = 0, fadeStart = 0, fadeLength = 1;

  // 0 inside the crowded area, rising to 1 at the end distance.
  const fadeProgress = (x, y) => textBands.length
    ? clamp((y - fadeStart) / fadeLength, 0, 1)
    : clamp((Math.hypot(x, y) - CROWDED_RADIUS) / (END_DISTANCE - CROWDED_RADIUS), 0, 1);
  const spacingScale = (x, y) => 1 + (EDGE_MULTIPLIER - 1) * fadeProgress(x, y);
  const keepChance = (x, y) => CENTER_DENSITY * Math.pow(1 - fadeProgress(x, y), FADE_CURVE);

  const viewport = document.getElementById('viewport');
  const world = document.getElementById('world');
  const menu = document.getElementById('menu');
  const quickNav = document.getElementById('quick-nav');
  const quickList = document.getElementById('quick-list');
  const photoCanvas = document.getElementById('photos');
  const photoCtx = photoCanvas.getContext('2d');

  const cam = { x: 0, y: 0, s: 1 };
  const layouts = new Map(); // "cx,cy" -> photo placements for that chunk
  let photos = [];           // { file, aspect, levels, color } for each image that loaded
  let menuHalfW = 0, menuHalfH = 0;

  // Small seeded random generator, so every visit builds the same landscape.
  function seededRandom(a, b) {
    let s = (Math.imul(a, 374761393) ^ Math.imul(b, 668265263) ^ Math.imul(SEED, 1442695041) ^ 0x9e3779b9) >>> 0;
    return () => {
      s = (s + 0x6d2b79f5) >>> 0;
      let t = s;
      t = Math.imul(t ^ (t >>> 15), t | 1);
      t ^= t + Math.imul(t ^ (t >>> 7), t | 61);
      return ((t ^ (t >>> 14)) >>> 0) / 4294967296;
    };
  }

  // Chunks are built in four passes (by the parity of their coordinates).
  // Chunks in the same pass never touch, and each chunk only has to avoid
  // photos from touching chunks built in an earlier pass.
  const phase = (cx, cy) => (cx & 1) + 2 * (cy & 1);

  function chunkLayout(cx, cy) {
    const key = cx + ',' + cy;
    if (layouts.has(key)) return layouts.get(key);

    // Chunks entirely past the end distance (plus a margin) stay empty.
    const nearX = clamp(0, cx * CHUNK, (cx + 1) * CHUNK);
    const nearY = Math.max(0, cy * CHUNK - contentBottom, -(cy + 1) * CHUNK);
    if (Math.hypot(nearX, nearY) > END_DISTANCE + REACH) {
      layouts.set(key, []);
      return [];
    }

    const neighbors = [];
    const p = phase(cx, cy);
    for (let dy = -1; dy <= 1; dy++) {
      for (let dx = -1; dx <= 1; dx++) {
        if ((dx || dy) && phase(cx + dx, cy + dy) < p) neighbors.push(...chunkLayout(cx + dx, cy + dy));
      }
    }

    const rnd = seededRandom(cx, cy);
    const placed = [];
    for (let i = 0; i < ATTEMPTS; i++) {
      const size = SIZE_MIN + rnd() * (SIZE_MAX - SIZE_MIN);
      const x = (cx + rnd()) * CHUNK;
      const y = (cy + rnd()) * CHUNK;
      const gap = (GAP_MIN + rnd() * (GAP_MAX - GAP_MIN)) * spacingScale(x, y);
      const pickRoll = rnd();
      const keepRoll = rnd();

      // Skip spots where even the smallest photo would crowd the menu.
      const minHalf = SIZE_MIN / 2 + FRAME + MENU_GAP;
      if (Math.abs(x) < menuHalfW + minHalf && Math.abs(y) < menuHalfH + minHalf) continue;
      // ...or would touch a section's text.
      if (textBands.some((b) => Math.abs(x) < b.hx + SIZE_MIN / 2 + FRAME &&
        y > b.y0 - SIZE_MIN / 2 - FRAME && y < b.y1 + SIZE_MIN / 2 + FRAME)) continue;

      // Prefer a photo that none of the nearby photos are already showing.
      const nearby = [...neighbors, ...placed].filter((o) => Math.hypot(o.x - x, o.y - y) < REACH * Math.SQRT2);
      const used = new Set(nearby.map((o) => o.index));
      const options = photos.map((_, j) => j).filter((j) => !used.has(j));
      const pool = options.length ? options : photos.map((_, j) => j);
      const index = pool[Math.floor(pickRoll * pool.length)];

      const aspect = photos[index].aspect;
      const w0 = aspect >= 1 ? size : size * aspect;
      const h0 = aspect >= 1 ? size / aspect : size;

      // Shrink the photo as much as needed to keep its spacing from every
      // neighbor (clearing a neighbor on either axis is enough). Spots that
      // would need it smaller than the smallest size are skipped.
      let fit = Math.max(
        (Math.abs(x) - menuHalfW - MENU_GAP - FRAME) / (w0 / 2),
        (Math.abs(y) - menuHalfH - MENU_GAP - FRAME) / (h0 / 2));
      fit = Math.min(1, fit);
      for (const b of textBands) {
        const fitX = (Math.abs(x) - b.hx - FRAME) / (w0 / 2);
        const fitY = (y < b.y0 ? b.y0 - FRAME - y : y - b.y1 - FRAME) / (h0 / 2);
        fit = Math.min(fit, Math.max(fitX, fitY));
      }
      for (const o of nearby) {
        const need = (gap + o.gap) / 2 + FRAME;
        const fitX = (Math.abs(x - o.x) - o.hw - need) / (w0 / 2);
        const fitY = (Math.abs(y - o.y) - o.hh - need) / (h0 / 2);
        fit = Math.min(fit, Math.max(fitX, fitY));
      }
      if (fit * size < SIZE_MIN) continue;

      const w = w0 * fit, h = h0 * fit;
      // Removed photos still reserve their space, which also spreads out the rest.
      const kept = keepRoll < keepChance(x, y);
      placed.push({ x, y, w, h, hw: w / 2 + FRAME, hh: h / 2 + FRAME, gap, index, kept });
    }

    layouts.set(key, placed);
    stats.layoutsBuilt++;
    return placed;
  }

  // Load each photo once up front: its shape makes spacing exact, and a set
  // of pre-shrunk copies (each half the size of the last) lets far-away
  // photos be drawn from a small copy instead of the full-size image.
  function loadPhotos() {
    return Promise.all(IMAGES.map((file) => new Promise((resolve) => {
      const img = new Image();
      img.onload = async () => {
        const sizes = [img]; // largest first
        let src = img, w = img.naturalWidth, h = img.naturalHeight;
        while (Math.max(w, h) > 48) {
          w = Math.max(1, Math.round(w / 2));
          h = Math.max(1, Math.round(h / 2));
          const c = document.createElement('canvas');
          c.width = w;
          c.height = h;
          const cx = c.getContext('2d');
          cx.imageSmoothingQuality = 'high';
          cx.drawImage(src, 0, 0, w, h);
          sizes.push(c);
          src = c;
        }
        // Average color, for photos too small on screen to show any detail.
        // (Browsers refuse to read pixels when the page is opened straight
        // from a folder, so fall back to a neutral grey there.)
        let color = 'rgb(128, 128, 128)';
        try {
          const dot = document.createElement('canvas').getContext('2d');
          dot.canvas.width = dot.canvas.height = 1;
          dot.drawImage(src, 0, 0, 1, 1);
          const [r, g, b] = dot.getImageData(0, 0, 1, 1).data;
          color = `rgb(${r}, ${g}, ${b})`;
        } catch {}
        // Hand every copy to the graphics card once, up front. Small canvases
        // drawn directly can get re-uploaded every time they're used.
        let levels = sizes;
        try { levels = await Promise.all(sizes.map((s) => createImageBitmap(s))); } catch {}
        resolve({ file, aspect: img.naturalWidth / img.naturalHeight, levels, color });
      };
      let triedOriginal = false;
      img.onerror = () => {
        if (triedOriginal) return resolve(null);
        triedOriginal = true;
        img.src = IMAGE_DIR + file; // no small copy: use the original
      };
      img.src = photoSrc(file);
    }))).then((list) => list.filter(Boolean));
  }

  // Smallest pre-shrunk copy that still has enough pixels for the size drawn.
  function pickLevel(photo, pixelsNeeded) {
    const levels = photo.levels;
    for (let i = levels.length - 1; i > 0; i--) {
      const c = levels[i];
      if (Math.max(c.width, c.height) >= pixelsNeeded) return c;
    }
    return levels[0];
  }

  // ---- Rendering ----------------------------------------------------------
  // Zoomed in, photos are drawn one by one. Zoomed out (hundreds of photos on
  // screen), whole areas are drawn once into cached images ("tiles", like an
  // online map) and each frame just places a handful of tiles.
  const TILE_PX = 512;                    // tile image size, before padding
  const TILES_BELOW = 0.5;                // use tiles at or below this zoom
  const PAD = SIZE_MAX / 2 + FRAME + 2;   // how far photos can overhang their chunk
  const tiles = new Map();                // "level:tx:ty" -> { canvas, fadeFrom }
  const revealed = new Map();             // chunk key -> when its photos first appeared
  const stats = { photos: 0, tiles: 0, log: [], totalFrames: 0, lastFrameAt: 0, mode: '—', tilesBuiltLog: [], layoutsBuilt: 0 };
  const tileKey = (k, tx, ty) => k + ':' + tx + ':' + ty;
  const fadeAlpha = (from, now) => (FADE_IN_MS > 0 ? clamp((now - from) / FADE_IN_MS, 0, 1) : 1);

  // Paint photos (in world coordinates) with as few drawing calls as
  // possible: all frames in one fill, all borders in one, then the images.
  // pxPerUnit = device pixels per world pixel, for picking detail levels.
  // Corner radius for a photo's outer edge (frame included), in world pixels.
  function cornerRadius(it) {
    if (!CORNERS_ON || CORNER_RADIUS <= 0) return 0;
    const shorter = Math.min(it.hw, it.hh) * 2;
    const r = CORNER_PERCENT ? (CORNER_RADIUS / 100) * shorter : CORNER_RADIUS;
    return Math.min(r, shorter / 2);
  }
  // Add a (possibly rounded) rectangle to the current path.
  function shape(ctx, x, y, w, h, r) {
    if (r > 0 && ctx.roundRect) ctx.roundRect(x, y, w, h, r);
    else ctx.rect(x, y, w, h);
  }

  function paintItems(ctx, items, pxPerUnit) {
    const tinyByPhoto = new Map(), framed = [];
    for (const it of items) {
      if (Math.max(it.w, it.h) * pxPerUnit < 6) {
        if (!tinyByPhoto.has(it.index)) tinyByPhoto.set(it.index, []);
        tinyByPhoto.get(it.index).push(it);
      } else {
        framed.push(it);
      }
    }
    // Too small for detail: one block of each photo's average color.
    for (const [index, list] of tinyByPhoto) {
      ctx.beginPath();
      for (const it of list) shape(ctx, it.x - it.hw, it.y - it.hh, it.hw * 2, it.hh * 2, cornerRadius(it));
      ctx.fillStyle = photos[index].color;
      ctx.fill();
    }
    if (!framed.length) return;

    ctx.beginPath();
    for (const it of framed) shape(ctx, it.x - it.hw, it.y - it.hh, it.hw * 2, it.hh * 2, cornerRadius(it));
    ctx.fillStyle = FRAME_FILL;
    ctx.fill();
    if (FRAME_BORDER * pxPerUnit >= 0.5) {
      // Border: tint the whole frame, then cover its inside back up.
      ctx.fillStyle = FRAME_COLOR;
      ctx.fill();
      const b = FRAME_BORDER;
      ctx.beginPath();
      for (const it of framed) shape(ctx, it.x - it.hw + b, it.y - it.hh + b, it.hw * 2 - 2 * b, it.hh * 2 - 2 * b, Math.max(0, cornerRadius(it) - b));
      ctx.fillStyle = FRAME_FILL;
      ctx.fill();
    }
    for (const it of framed) {
      const level = pickLevel(photos[it.index], Math.max(it.w, it.h) * pxPerUnit);
      // The photo's own corners follow the outer curve, inset by the frame.
      const r = Math.max(0, cornerRadius(it) - FRAME);
      if (r * pxPerUnit >= 0.5 && ctx.roundRect) {
        ctx.save();
        ctx.beginPath();
        ctx.roundRect(it.x - it.w / 2, it.y - it.h / 2, it.w, it.h, r);
        ctx.clip();
        ctx.drawImage(level, it.x - it.w / 2, it.y - it.h / 2, it.w, it.h);
        ctx.restore();
      } else {
        ctx.drawImage(level, it.x - it.w / 2, it.y - it.h / 2, it.w, it.h);
      }
    }
  }

  // Draw one chunk's visible photos straight onto the screen canvas.
  // Returns true while they're still fading in.
  function paintChunk(ctx, cx, cy, view, pxPerUnit, now) {
    const key = cx + ',' + cy;
    const items = layouts.get(key);
    if (!items) return false;
    const visible = items.filter((it) => it.kept &&
      it.x + it.hw > view.l && it.x - it.hw < view.r && it.y + it.hh > view.t && it.y - it.hh < view.b);
    if (!visible.length) return false;
    if (!revealed.has(key)) revealed.set(key, now);
    const alpha = fadeAlpha(revealed.get(key), now);
    ctx.globalAlpha = alpha;
    paintItems(ctx, visible, pxPerUnit);
    ctx.globalAlpha = 1;
    stats.photos += visible.length;
    return alpha < 1;
  }

  // Draw an n-by-n square of chunks directly (only the parts on screen).
  function paintChunksDirect(ctx, cx0, cy0, n, view, pxPerUnit, now) {
    let fading = false;
    const xa = Math.max(cx0, Math.floor((view.l - PAD) / CHUNK)), xb = Math.min(cx0 + n - 1, Math.floor((view.r + PAD) / CHUNK));
    const ya = Math.max(cy0, Math.floor((view.t - PAD) / CHUNK)), yb = Math.min(cy0 + n - 1, Math.floor((view.b + PAD) / CHUNK));
    for (let cy = ya; cy <= yb; cy++) {
      for (let cx = xa; cx <= xb; cx++) {
        if (paintChunk(ctx, cx, cy, view, pxPerUnit, now)) fading = true;
      }
    }
    return fading;
  }

  // Work out any missing layouts in an n-by-n square of chunks.
  // Returns false if it ran out of time.
  function ensureLayouts(cx0, cy0, n, deadline) {
    for (let cy = cy0; cy < cy0 + n; cy++) {
      for (let cx = cx0; cx < cx0 + n; cx++) {
        if (layouts.has(cx + ',' + cy)) continue;
        if (performance.now() > deadline) return false;
        chunkLayout(cx, cy);
      }
    }
    return true;
  }

  // Draw all photos belonging to a tile's chunks into a new cached image.
  // d = image pixels per world pixel.
  function rasterTile(k, tx, ty, d, now) {
    const n = 1 << k, T = CHUNK * n;
    const items = [];
    let fadeFrom = Infinity;
    for (let cy = ty * n; cy < (ty + 1) * n; cy++) {
      for (let cx = tx * n; cx < (tx + 1) * n; cx++) {
        const key = cx + ',' + cy;
        const kept = layouts.get(key).filter((it) => it.kept);
        if (!kept.length) continue;
        if (!revealed.has(key)) revealed.set(key, now);
        // A tile only fades in if everything in it is new.
        fadeFrom = Math.min(fadeFrom, revealed.get(key));
        for (const it of kept) items.push(it);
      }
    }
    if (!items.length) return { canvas: null };
    const canvas = document.createElement('canvas');
    canvas.width = canvas.height = Math.ceil((T + 2 * PAD) * d);
    const c = canvas.getContext('2d');
    c.setTransform(d, 0, 0, d, -(tx * T - PAD) * d, -(ty * T - PAD) * d);
    c.imageSmoothingQuality = 'medium';
    paintItems(c, items, d);
    return { canvas, fadeFrom };
  }

  function drawTile(ctx, tile, x0, y0, T, now) {
    if (!tile.canvas) return false;
    const alpha = fadeAlpha(tile.fadeFrom, now);
    ctx.globalAlpha = alpha;
    // Plain smoothing: tiles are at most 2x larger than drawn, and higher
    // quality would recompute a shrunk copy of the tile every frame.
    ctx.imageSmoothingQuality = 'low';
    ctx.drawImage(tile.canvas, x0 - PAD, y0 - PAD, T + 2 * PAD, T + 2 * PAD);
    ctx.imageSmoothingQuality = 'medium';
    ctx.globalAlpha = 1;
    stats.tiles++;
    return alpha < 1;
  }

  // A tile that isn't built yet: borrow the next level up (cropped) or the
  // four below, and draw photos directly for anything still missing.
  function drawStandIn(ctx, k, tx, ty, view, pxPerUnit, now) {
    const n = 1 << k, T = CHUNK * n;
    const px = Math.floor(tx / 2), py = Math.floor(ty / 2);
    const parent = tiles.get(tileKey(k + 1, px, py));
    if (parent) {
      ctx.save();
      ctx.beginPath();
      ctx.rect(tx * T, ty * T, T, T);
      ctx.clip();
      const fading = drawTile(ctx, parent, px * 2 * T, py * 2 * T, 2 * T, now);
      ctx.restore();
      return fading;
    }
    if (k === 0) return paintChunksDirect(ctx, tx, ty, 1, view, pxPerUnit, now);
    let fading = false;
    for (let dy = 0; dy < 2; dy++) {
      for (let dx = 0; dx < 2; dx++) {
        const sx = tx * 2 + dx, sy = ty * 2 + dy;
        const child = tiles.get(tileKey(k - 1, sx, sy));
        const f = child
          ? drawTile(ctx, child, sx * (T / 2), sy * (T / 2), T / 2, now)
          : paintChunksDirect(ctx, sx * (n / 2), sy * (n / 2), n / 2, view, pxPerUnit, now);
        if (f) fading = true;
      }
    }
    return fading;
  }

  let renderQueued = false;
  function requestRender() {
    if (renderQueued) return;
    renderQueued = true;
    requestAnimationFrame(() => { renderQueued = false; render(); });
  }

  let lastCam = {}, moving = false, settleTimer = 0;
  // In read mode the view stays centered sideways at normal zoom, and only
  // scrolls as far up and down as there are photos.
  function render() {
    if (READ_MODE) return readFrame();
    if (!perfOn) return drawFrame();
    const t0 = performance.now();
    drawFrame();
    const t1 = performance.now();
    stats.log.push({ t: t1, js: t1 - t0, gap: stats.lastFrameAt && t0 - stats.lastFrameAt < 250 ? t0 - stats.lastFrameAt : 0 }); // longer gaps = standing still, not a slow frame
    stats.lastFrameAt = t0;
    stats.totalFrames++;
  }

  function drawFrame() {
    const W = window.innerWidth, H = window.innerHeight;
    const originX = W / 2 - cam.x * cam.s, originY = H / 2 - cam.y * cam.s;
    world.style.transform = `translate(${originX}px, ${originY}px) scale(${cam.s})`;
    updateQuickNav(originX, originY, cam.s, W, H);

    // "Moving" lasts until the view has been still for 150ms.
    if (cam.x !== lastCam.x || cam.y !== lastCam.y || cam.s !== lastCam.s) {
      lastCam = { x: cam.x, y: cam.y, s: cam.s };
      moving = true;
      world.classList.add('moving');
      clearTimeout(settleTimer);
      settleTimer = setTimeout(() => {
        moving = false;
        world.classList.remove('moving');
        requestRender(); // redraw at full sharpness
      }, 150);
    }

    const fullDpr = window.devicePixelRatio || 1;
    const tileDensity = cam.s * Math.min(fullDpr, 1); // tiles hold at most 1 pixel per CSS pixel
    const useTiles = TILES_ON && tileDensity <= TILES_BELOW;
    const dpr = LOW_RES_MOVING && moving && useTiles ? Math.min(fullDpr, 1) : fullDpr;

    if (GRID_ON && GRID_SEPARATE) {
      const g = prepareCanvas(gridCanvas, gridCtx, dpr);
      paintGrid(gridCtx, g.w, g.h, originX, originY, cam.s);
    }
    const { w, h } = prepareCanvas(photoCanvas, photoCtx, dpr);
    if (GRID_ON && !GRID_SEPARATE) paintGrid(photoCtx, w, h, originX, originY, cam.s);

    stats.photos = 0;
    stats.tiles = 0;
    if (!photos.length) return;

    const ctx = photoCtx;
    ctx.translate(originX, originY);
    ctx.scale(cam.s, cam.s);
    ctx.imageSmoothingQuality = 'medium';
    const now = performance.now();
    // Time allowed per frame for working out layouts and building tiles.
    const deadline = now + (moving ? 4 : 10);
    const pxPerUnit = cam.s * fullDpr;
    const halfW = W / 2 / cam.s, halfH = H / 2 / cam.s;
    const view = { l: cam.x - halfW, r: cam.x + halfW, t: cam.y - halfH, b: cam.y + halfH };
    let needsAnotherFrame = false;
    let cx0, cx1, cy0, cy1; // chunks worth keeping layouts for

    if (useTiles) {
      // Tile level: each tile covers 2^k chunks per side, about TILE_PX pixels across.
      const k = Math.max(0, Math.floor(Math.log2(TILE_PX / (CHUNK * tileDensity))));
      const n = 1 << k, T = CHUNK * n, d = TILE_PX / T;
      if (perfOn) stats.mode = `tiles · level ${k} (${n}×${n} areas each)`;
      const tx0 = Math.floor((view.l - PAD) / T), tx1 = Math.floor((view.r + PAD) / T);
      const ty0 = Math.floor((view.t - PAD) / T), ty1 = Math.floor((view.b + PAD) / T);

      // Build missing tiles, nearest the middle of the screen first.
      const missing = [];
      for (let ty = ty0; ty <= ty1; ty++) {
        for (let tx = tx0; tx <= tx1; tx++) {
          if (!tiles.has(tileKey(k, tx, ty))) missing.push([tx, ty]);
        }
      }
      const midX = cam.x / T - 0.5, midY = cam.y / T - 0.5;
      missing.sort((a, b) => Math.hypot(a[0] - midX, a[1] - midY) - Math.hypot(b[0] - midX, b[1] - midY));
      let built = 0;
      for (const [tx, ty] of missing) {
        if (performance.now() > deadline || !ensureLayouts(tx * n, ty * n, n, deadline)) break;
        tiles.set(tileKey(k, tx, ty), rasterTile(k, tx, ty, d, now));
        built++;
        if (perfOn) stats.tilesBuiltLog.push(performance.now());
      }
      const allReady = built === missing.length;
      if (!allReady) needsAnotherFrame = true;

      for (let ty = ty0; ty <= ty1; ty++) {
        for (let tx = tx0; tx <= tx1; tx++) {
          const tile = tiles.get(tileKey(k, tx, ty));
          const fading = tile
            ? drawTile(ctx, tile, tx * T, ty * T, T, now)
            : drawStandIn(ctx, k, tx, ty, view, pxPerUnit, now);
          if (fading) needsAnotherFrame = true;
        }
      }

      // Keep this level's tiles near the screen. Neighboring levels are only
      // kept as stand-ins until this level is complete.
      for (const key of tiles.keys()) {
        const [lk, x, y] = key.split(':').map(Number);
        let keep = false;
        if (lk === k) {
          keep = x >= tx0 - 1 && x <= tx1 + 1 && y >= ty0 - 1 && y <= ty1 + 1;
        } else if (!allReady && lk === k + 1) {
          keep = x >= Math.floor(tx0 / 2) && x <= Math.floor(tx1 / 2) && y >= Math.floor(ty0 / 2) && y <= Math.floor(ty1 / 2);
        } else if (!allReady && lk === k - 1) {
          keep = x >= tx0 * 2 && x <= tx1 * 2 + 1 && y >= ty0 * 2 && y <= ty1 * 2 + 1;
        }
        if (!keep) tiles.delete(key);
      }
      cx0 = tx0 * n; cx1 = (tx1 + 1) * n - 1;
      cy0 = ty0 * n; cy1 = (ty1 + 1) * n - 1;
    } else {
      if (tiles.size) tiles.clear();
      if (perfOn) stats.mode = 'single photos';
      cx0 = Math.floor((view.l - PAD) / CHUNK); cx1 = Math.floor((view.r + PAD) / CHUNK);
      cy0 = Math.floor((view.t - PAD) / CHUNK); cy1 = Math.floor((view.b + PAD) / CHUNK);

      const missing = [];
      for (let cy = cy0; cy <= cy1; cy++) {
        for (let cx = cx0; cx <= cx1; cx++) {
          if (!layouts.has(cx + ',' + cy)) missing.push([cx, cy]);
        }
      }
      const midX = cam.x / CHUNK - 0.5, midY = cam.y / CHUNK - 0.5;
      missing.sort((a, b) => Math.hypot(a[0] - midX, a[1] - midY) - Math.hypot(b[0] - midX, b[1] - midY));
      for (const [cx, cy] of missing) {
        if (performance.now() > deadline) { needsAnotherFrame = true; break; }
        chunkLayout(cx, cy);
      }
      for (let cy = cy0; cy <= cy1; cy++) {
        for (let cx = cx0; cx <= cx1; cx++) {
          if (paintChunk(ctx, cx, cy, view, pxPerUnit, now)) needsAnotherFrame = true;
        }
      }
    }
    if (needsAnotherFrame) requestRender();

    // Forget layouts far off screen once there are a lot of them (they're
    // rebuilt identically if the visitor comes back).
    const visibleChunks = (cx1 - cx0 + 1) * (cy1 - cy0 + 1);
    if (layouts.size > Math.max(600, visibleChunks * 4)) {
      const spare = 4;
      for (const key of layouts.keys()) {
        const [cx, cy] = key.split(',').map(Number);
        if (cx < cx0 - spare || cx > cx1 + spare || cy < cy0 - spare || cy > cy1 + spare) {
          layouts.delete(key);
          revealed.delete(key);
        }
      }
    }
  }

  // Optional on-screen performance panel: on at start with SHOW_PERFORMANCE_INFO,
  // or opened any time with Ctrl+P. Press P to hide or show it.
  let perfPanel = null;
  function openPerfPanel() {
    const panel = document.createElement('div');
