<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Payments</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="page.css">
<link rel="stylesheet" href="phonemenu.css">
</head>
<body data-page="Payments">
  <!-- The same menu bar as the home page's; page.js fills it in. -->
  <nav id="quick-nav" aria-label="Menu">
    <div id="quick-list"></div>
  </nav>
  <main class="payments">
    <h1 id="title">Payments</h1>

    <!-- The Zelle logo (ZELLE_LOGO in settings.md). Until that file is
         there, the word Zelle stands in for it. -->
    <p class="zelle-mark">
      <img id="zelle-logo" alt="Zelle" hidden>
      <span id="zelle-word">Zelle</span>
    </p>

    <!-- The words on this page come from the file named in
         PAYMENTS_TEXT_FILE (sections/payments/payments.md). -->
    <div class="pay-content" id="pay-content"></div>
  </main>
  <script src="markdown.js"></script>
  <script src="phonemenu.js"></script>
  <script src="page.js"></script>
  <script src="payments.js"></script>
</body>
</html>
